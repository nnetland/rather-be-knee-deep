  main.innerHTML = `
    <div class="page-column">
      <h1 class="display-h1">Where's it dumping?</h1>
      ${showControls ? `
        <div class="chase-controls" style="margin-top:var(--space-4)">
          <div id="chase-origin-control"></div>
          <label class="tap-chip" style="width:auto;min-width:220px" id="chase-beginner-toggle-wrap">
            <span class="tap-chip__indicator tap-chip__indicator--check" id="chase-beginner-indicator">${ICONS.check}</span>
            <span class="tap-chip__body">
              <span class="tap-chip__label">Include beginner-friendly options</span>
              <span class="tap-chip__sublabel">Off by default — this list leans toward serious terrain.</span>
            </span>
          </label>
        </div>` : ""}
      <div id="chase-freshness"></div>
      <div id="chase-body"></div>
    </div>`;

  if (showControls) {
    renderChaseOriginControl();
    wireBeginnerToggle();
  }
  document.title = "Where it's dumping this week";
  setOgMeta({
    title: "Where it's dumping this week",
    description: "Ranked by real snow quality, not just inches — updated from live forecasts.",
  });

  loadAndRenderChase();
  focusHeading(main);
}

function renderChaseOriginControl() {
  const wrap = document.getElementById("chase-origin-control");
  const selected = state.chaseAnswers.region;
  const selectedLabel = selected ? (regionById(selected) || {}).label : null;
  wrap.innerHTML = `
    <div>
      <span class="body-sm" style="display:block;margin-bottom:var(--space-2)">Closest to home? (optional)</span>
      <div style="display:flex;gap:var(--space-2);flex-wrap:wrap;align-items:center">
        <select id="chase-region-select" class="filter-chip" style="min-height:44px">
          <option value="">Skip</option>
          ${REGIONS.filter((r) => r.id !== "elsewhere").map((r) => `<option value="${r.id}" ${selected === r.id ? "selected" : ""}>${r.label}</option>`).join("")}
        </select>
      </div>
    </div>`;
  document.getElementById("chase-region-select").addEventListener("change", (e) => {
    state.chaseAnswers.region = e.target.value || null;
    renderChaseList(); // re-rank with new feasibility discount, no reload of forecasts needed
  });
}

function wireBeginnerToggle() {
  const wrapEl = document.getElementById("chase-beginner-toggle-wrap");
  const indicator = document.getElementById("chase-beginner-indicator");
  const sync = () => {
    wrapEl.classList.toggle("tap-chip--selected", state.chaseAnswers.includeBeginnerFriendly);
    wrapEl.setAttribute("aria-checked", String(state.chaseAnswers.includeBeginnerFriendly));
  };
  wrapEl.setAttribute("role", "checkbox"); wrapEl.tabIndex = 0;
  sync();
  const toggle = () => { state.chaseAnswers.includeBeginnerFriendly = !state.chaseAnswers.includeBeginnerFriendly; sync(); renderChaseList(true); };
  wrapEl.addEventListener("click", toggle);
  wrapEl.addEventListener("keydown", (e) => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); toggle(); } });
}

function loadAndRenderChase() {
  const body = document.getElementById("chase-body");
  const now = new Date();
  const seasonInfo = classifySeasonState(RESORTS, now);
  state.chaseSeasonInfo = seasonInfo;

  if (seasonInfo.state === "off-season") {
    // Nothing in the pool is realistically open — don't fetch, don't rank,
    // don't render a solemn list of near-zero forecasts. Say so plainly.
    renderChaseOffSeason(body);
    return;
  }

  if (state.chaseCache) {
    renderChaseList();
    return;
  }

  // Shoulder season (October, May): only fetch/rank resorts that are
  // themselves plausibly open by SEASON_OPEN_FRACTION's definition — a
  // resort that's still weeks from its published open date isn't made
  // "open" by a live forecast existing for its coordinates.
  const usResorts = RESORTS.filter((r) => r.country === "USA" && r.lat != null &&
    (seasonInfo.state !== "shoulder" || seasonFraction(r, now) >= SEASON_OPEN_FRACTION));

  if (!usResorts.length) {
    // Safety net for the very start of the shoulder ramp, where the
    // aggregate classification says "shoulder" but no single resort
    // individually clears the per-resort bar yet — fall back to the same
    // honest off-season screen rather than an empty ranked list.
    renderChaseOffSeason(body);
    return;
  }

  state.chaseLoadHandle = loadChaseForecasts(usResorts, (phase, payload) => {
    if (phase === "loading") {
      body.innerHTML = `<div class="loading-state"><div class="loading-spinner" aria-hidden="true"></div><p class="body-md">Checking today's snow…</p></div>`;
    } else if (phase === "escalated") {
      const loadingState = body.querySelector(".loading-state");
      if (!loadingState) return;
      if (!loadingState.querySelector(".escalation-note")) {
        const note = document.createElement("p");
        note.className = "escalation-note body-sm";
        note.textContent = "Still checking — the forecast service is being slow today.";
        loadingState.appendChild(note);
      }
      // Manual skip-ahead escape: the historical data is already sitting
      // there, so an impatient or poorly-connected user doesn't have to
      // ride out the full 10s hard timeout to see it.
      if (!loadingState.querySelector("#chase-skip-btn")) {
        const skipBtn = document.createElement("button");
        skipBtn.className = "btn btn-secondary";
        skipBtn.id = "chase-skip-btn";
        skipBtn.type = "button";
        skipBtn.textContent = "Show typical-season data now";
        skipBtn.addEventListener("click", () => { if (state.chaseLoadHandle) state.chaseLoadHandle.skip(); });
        loadingState.appendChild(skipBtn);
      }
    } else if (phase === "done") {
      state.chaseCache = payload;
      state.chaseLoadHandle = null;
      renderChaseList();
      if (payload.anyFallback) {
        announce("forecast-status-announcer", "Forecast data unavailable — showing typical season snowfall instead of this week's forecast.");
      }
    }
  });
}

function renderChaseList(isRefresh) {
  const body = document.getElementById("chase-body");
  const freshnessWrap = document.getElementById("chase-freshness");
  if (!state.chaseCache) return;

  const { forecasts, anyFallback } = state.chaseCache;
  freshnessWrap.innerHTML = anyFallback
    ? `<div class="freshness-badge freshness-badge--fallback" id="freshness-badge">
        <span id="freshness-icon-historical">${ICONS.signalSlash}</span>
        <span class="freshness-badge__text body-sm">Not a live forecast</span>
      </div>
      <p class="body-sm" style="color:var(--text-secondary);margin:0 0 var(--space-4)">We couldn't reach the live forecast right now. This is the typical snowfall for this time of year, not what's coming this week. <button class="btn-text" id="retry-forecast" type="button" style="padding:0">Try again</button></p>`
    : `<div class="freshness-badge" id="freshness-badge"><span id="freshness-icon-live">${ICONS.live}</span><span class="freshness-badge__text body-sm">Live forecast · updated moments ago</span></div>`;

  const retryBtn = document.getElementById("retry-forecast");
  if (retryBtn) retryBtn.addEventListener("click", () => { state.chaseCache = null; loadAndRenderChase(); });

  const ranked = rankChaseTheSnow(forecasts, state.chaseAnswers, RESORTS);
  const canada = rankCanadaTypicalSeason(RESORTS);

  // Shoulder-season notice (October, May): the list below only includes
  // resorts that are individually plausibly open (see loadAndRenderChase's
  // season-window filter) — this says so plainly rather than letting a
  // shorter-than-usual list read as a data problem.
  const seasonNoticeHtml = (state.chaseSeasonInfo && state.chaseSeasonInfo.state === "shoulder")
    ? `<div class="canada-divider" id="season-shoulder-notice">
        <span class="canada-divider__icon" aria-hidden="true">${ICONS.snow}</span>
        <div class="canada-divider__body">
          <p class="body-sm">Not every resort is open yet this time of year. This list only includes places that are typically running by now.</p>
        </div>
      </div>`
    : "";

  if (!ranked.length) {
    body.innerHTML = seasonNoticeHtml + `<div class="center-state">${ICONS.warning}<p class="body-md">No resorts matched right now — try including beginner-friendly options.</p></div>` + canadaSectionHtml(canada);
    wireCanadaHandled();
    return;
  }

  body.innerHTML = seasonNoticeHtml + `<ol class="chase-list" id="chase-us-list">` +
    ranked.map((row, i) => chaseRowHtml(row, i + 1)).join("") +
    `</ol>` + canadaSectionHtml(canada);

  document.querySelectorAll(".chase-row[data-rid]").forEach((rowEl) => {
    rowEl.addEventListener("click", () => showChaseRowDetail(rowEl.dataset.rid));
    rowEl.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); showChaseRowDetail(rowEl.dataset.rid); } });
  });

  if (!isRefresh) {
    revealListRows(document.querySelectorAll("#chase-us-list .chase-row"));
  } else {
    refreshListRows(document.querySelectorAll("#chase-us-list .chase-row"));
  }
}

function chaseRowHtml(row, rank) {
  const { resort, totalInches, snowQuality, feasibility } = row;
  const cold = snowQuality >= 0.5;
  const qualityWord = cold ? "Cold, light snow" : "Heavier, wetter snow";
  const tags = resort.best_for_tags || [];
  const terrainWord = tags.includes("steeps") ? "steep terrain to use it" : tags.includes("tree-skiing") ? "trees to use it" : "terrain to match";
  const reason = `${qualityWord} + ${terrainWord}`;
  const region = resort.state_province + (resort.country === "Canada" ? ", Canada" : "");

  let feasibilityChip = "";
  if (state.chaseAnswers.region && feasibility && feasibility.distanceMiles != null) {
    const hrs = Math.max(1, Math.round(feasibility.distanceMiles / 55));
    feasibilityChip = `<span class="chase-flag body-sm">${pluralize(hrs, "hour")} drive from ${(regionById(state.chaseAnswers.region) || {}).label || "your area"}</span>`;
  }
  const crowdFlag = (resort.crowd_level === "brutal" || resort.crowd_level === "high")
    ? `<span class="chase-flag chase-flag--crowd">${ICONS.crowd} Heads up — this gets crowded on a powder day</span>` : "";
  const nicoleFlag = resort.hot_take ? `<span class="chase-flag chase-flag--nicole">● Nicole's take →</span>` : "";

  return `
    <li>
      <div class="chase-row" data-rid="${resort.id}" role="link" tabindex="0" aria-label="${escapeHtml(resort.name)}, ${escapeHtml(region)}. ${totalInches} inches forecast next 7 days. ${escapeHtml(reason)}.">
        <span class="chase-row__avatar" aria-hidden="true">${badgeSvg(resort, "chase-row")}<span class="chase-row__rank">${rank}</span></span>
        <span class="chase-row__main">
          <span class="chase-row__name display-h3">${escapeHtml(resort.name)}</span>
          <span class="chase-row__region body-sm">${escapeHtml(region)}</span>
          <span class="chase-row__reason body-sm">${escapeHtml(reason)}</span>
          <span class="chase-row__flags">${feasibilityChip}${crowdFlag}${nicoleFlag}</span>
        </span>
        <span class="chase-row__badge">
          <span class="forecast-badge">
            <span class="forecast-badge__top">
              <span class="forecast-badge__icon">${cold ? ICONS.crystal : ICONS.droplet}</span>
              <span class="forecast-badge__inches data-inline">${totalInches}"</span>
            </span>
            <span class="forecast-badge__desc">next 7 days</span>
          </span>
        </span>
      </div>
    </li>`;
}

function canadaSectionHtml(canada) {
  if (!canada.length) return "";
  return `
    <div class="canada-divider">
      <span class="canada-divider__icon">${ICONS.signalSlash}</span>
      <div class="canada-divider__body">
        <h2 class="display-h3">Canada — no live forecast</h2>
        <p class="body-sm">The live forecast service only covers the US. These are ranked by typical season snowfall, not this week's — check the resort's own snow report for real-time numbers.</p>
      </div>
    </div>
    <ol class="chase-list" id="chase-canada-list">
      ${canada.map((resort, i) => typicalSeasonRowHtml(resort, i + 1)).join("")}
    </ol>`;
}

// Shared by the Canada section (always "typical season, not live" — NOAA
// has no non-US coverage) and the off-season preview below (deliberately
// the same visual/semantic treatment: both are honestly-labeled annual
// averages, never presented as this week's conditions).
function typicalSeasonRowHtml(resort, rank) {
  const region = resort.state_province + (resort.country === "Canada" ? ", Canada" : "");
  const nicoleFlag = resort.hot_take ? `<span class="chase-flag chase-flag--nicole">● Nicole's take →</span>` : "";
  return `
    <li>
      <div class="chase-row" data-rid="${resort.id}" role="link" tabindex="0" aria-label="${escapeHtml(resort.name)}, ${escapeHtml(region)}. Typical season average ${resort.avg_annual_snowfall_in ?? "unpublished"} inches. Not a live forecast.">
        <span class="chase-row__avatar" aria-hidden="true">${badgeSvg(resort, "chase-row")}<span class="chase-row__rank">${rank}</span></span>
        <span class="chase-row__main">
          <span class="chase-row__name display-h3">${escapeHtml(resort.name)}</span>
          <span class="chase-row__region body-sm">${escapeHtml(region)}</span>
          <span class="chase-row__flags">${nicoleFlag}</span>
        </span>
        <span class="chase-row__badge">
          <span class="forecast-badge">
            <span class="typical-season-tag">Typical season</span>
            <span class="forecast-badge__top">
              <span class="forecast-badge__icon">${ICONS.snow}</span>
              <span class="forecast-badge__inches data-inline">${resort.avg_annual_snowfall_in != null ? resort.avg_annual_snowfall_in + '"/yr' : "—"}</span>
            </span>
          </span>
        </span>
      </div>
    </li>`;
}

function wireCanadaHandled() {
  document.querySelectorAll("#chase-canada-list .chase-row, .chase-row[data-rid]").forEach((rowEl) => {
    if (rowEl.dataset.wired) return;
    rowEl.dataset.wired = "1";
    rowEl.addEventListener("click", () => showChaseRowDetail(rowEl.dataset.rid));
    rowEl.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); showChaseRowDetail(rowEl.dataset.rid); } });
  });
}

// ---------------------------------------------------------------------------
// Off-season state (fix round, 2026-08-04). Design intent: this is not a
// banner bolted onto the normal ranked list — it fully replaces it. The
// screen states its situation plainly (nothing's realistically open), gives
// the one genuinely useful next action for August (plan ahead), and — since
// hiding all snow data outright would leave a visitor with nothing —
// optionally surfaces a clearly-labeled, collapsed-by-default preview of
// where it typically dumps in a normal mid-winter, built from the same
// honestly-labeled "typical season, not a forecast" pattern already used for
// Canada. It never claims that preview is current.
// ---------------------------------------------------------------------------

function topTypicalSeasonPreview(pool, n) {
  return pool
    .filter((r) => r.avg_annual_snowfall_in != null)
    .slice()
    .sort((a, b) => b.avg_annual_snowfall_in - a.avg_annual_snowfall_in)
    .slice(0, n);
}

function offSeasonPreviewHtml(preview) {
  const panelId = "offseason-preview-panel";
  return `
    <div class="offseason-preview">
      <button type="button" class="notes-row__expand-btn" aria-expanded="false" aria-controls="${panelId}" id="offseason-preview-toggle">
        <span>See where it typically dumps in mid-winter</span>
        <span class="stat-tile__expand-icon" aria-hidden="true">${ICONS.chevronDown}</span>
      </button>
      <div id="${panelId}" hidden>
        <div class="canada-divider" style="margin-top:var(--space-3)">
          <span class="canada-divider__icon" aria-hidden="true">${ICONS.signalSlash}</span>
          <div class="canada-divider__body">
            <span class="typical-season-tag">Typical season, not a forecast</span>
            <p class="body-sm">Based on typical snowfall for this time of year in a normal season, not what's happening right now.</p>
          </div>
        </div>
        <ol class="chase-list">
          ${preview.map((resort, i) => typicalSeasonRowHtml(resort, i + 1)).join("")}
        </ol>
      </div>
    </div>`;
}

function renderChaseOffSeason(body) {
  const preview = topTypicalSeasonPreview(RESORTS, 5);
  body.innerHTML = `
    <div class="center-state">
      ${ICONS.snow}
      <h2 class="display-h3">Nothing's open right now</h2>
      <p class="body-md" style="max-width:32rem">Most resorts open in November. Plan a trip now, then come back to chase the snow once the season starts.</p>
      <button class="btn btn-primary" id="offseason-plan-cta" type="button">Plan a trip</button>
    </div>
    ${preview.length ? offSeasonPreviewHtml(preview) : ""}`;

  document.getElementById("offseason-plan-cta").addEventListener("click", () => navigate("plan"));

  const toggleBtn = document.getElementById("offseason-preview-toggle");
  if (toggleBtn) {
    toggleBtn.addEventListener("click", () => {
      const panel = document.getElementById(toggleBtn.getAttribute("aria-controls"));
      if (!panel) return;
      panel.hidden = !panel.hidden;
      toggleBtn.setAttribute("aria-expanded", String(!panel.hidden));
    });
  }

  body.querySelectorAll(".chase-row[data-rid]").forEach((rowEl) => {
    rowEl.addEventListener("click", () => showChaseRowDetail(rowEl.dataset.rid));
    rowEl.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); showChaseRowDetail(rowEl.dataset.rid); } });
  });
}

function showChaseRowDetail(rid) {
  const resort = RESORTS_BY_ID[rid];
  if (!resort) return;
  // Reuses the trip-planner result-card component with a minimal, honest
  // reason set built purely from Chase-the-Snow context (no quiz answers to
  // draw from in this mode).
  const bullets = [];
  const fc = state.chaseCache && state.chaseCache.forecasts[rid];
  if (fc) {
    bullets.push(fc.isLive ? `${fc.totalInches}" forecast over the next 7 days.` : `Typical for this time of year: about ${fc.totalInches}" a week during the core season.`);
  } else if (resort.avg_annual_snowfall_in != null) {
    // Off-season preview row — there's no forecast fetch in this state at
    // all (see renderChaseOffSeason), so the only honest snow fact
    // available is the published annual average, clearly framed as such.
    bullets.push(`Averages about ${resort.avg_annual_snowfall_in}" a year in a typical season.`);
  }
  // sanitizeDatasetProse strips research-register framing before this raw
  // dataset field reaches a reader (Fix 3, synthetic-user-testing.md) — same
  // helper as the result card's ski-school disclosure and Range Readout.
  if (resort.character_note) bullets.push(sanitizeDatasetProse(resort.character_note));
  if (resort.crowd_level) bullets.push(CROWD_COPY[resort.crowd_level]);
  const payload = { v: 1, rid: resort.id, reasonBullets: bullets.slice(0, 3), showRangeReadout: false, range: null };
  // fresh: true — this is a same-session, self-generated view (the user just
  // tapped their own Chase-the-Snow row), not a cold shared link, so it must
  // render in the "Your pick" / "You said" voice, not the cold-view one.
  navigate("result", { shared: payload, shareToken: b64urlEncode(JSON.stringify(payload)), fresh: true });
}

function revealListRows(rows) {
  const reduce = reduceMotion();
  rows.forEach((row, i) => {
    if (reduce) { row.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 160, easing: "ease", fill: "both" }); return; }
    const staggerIndex = Math.min(i, 5);
    row.animate([{ opacity: 0, transform: "translateY(8px)" }, { opacity: 1, transform: "translateY(0)" }], { duration: 160, delay: staggerIndex * 50, easing: "cubic-bezier(.16,1,.3,1)", fill: "both" });
  });
}
function refreshListRows(rows) {
  rows.forEach((row) => row.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 160, easing: "ease", fill: "both" }));
}

</script>
<script>
// ---------------------------------------------------------------------------
// Quiver Check — the UI layer. All the reasoning lives in quiver.js; this
// file picks a resort, picks a day, and renders the call.
//
// Three steps, one question each, matching the trip planner's established
// idiom rather than inventing a fourth interaction pattern for a fourth mode:
//   resort  ->  day  ->  the call
//
// Season handling is deliberately identical to Chase the Snow's, at the
// Director's explicit direction: when nothing in the pool is realistically
// open, this mode does not render a picker, does not fetch, and does not
// produce a ski recommendation for a mountain that isn't spinning lifts. The
// same shoulder-season filter applies in October and May.
// ---------------------------------------------------------------------------

function renderQuiver(main) {
  const now = new Date();
  const seasonInfo = classifySeasonState(RESORTS, now);
  state.chaseSeasonInfo = seasonInfo;

  main.innerHTML = `<div class="page-column"><div id="quiver-body"></div></div>`;
  document.title = "Quiver Check — which skis to bring";
  setOgMeta({
    title: "Quiver Check — which skis to bring",
    description: "Tell it where you're going and when. It reads the forecast and tells you what to put on your feet.",
  });

  const body = document.getElementById("quiver-body");
  if (seasonInfo.state === "off-season") {
    renderQuiverOffSeason(body);
    focusHeading(main);
    return;
  }
  renderQuiverStep();
  focusHeading(main);
}

// Mirrors renderChaseOffSeason's stance exactly — this is not a banner on top
// of a working picker, it replaces the mode. The one difference is the copy,
// because the useful next action from here is different: Chase's off-season
// screen sends you to plan a trip, and so does this one, but the sentence
// explaining why has to be about skis rather than about rankings.
function renderQuiverOffSeason(body) {
  body.innerHTML = `
    <h1 class="display-h1">Quiver Check</h1>
    <div class="center-state">
      ${ICONS.snow}
      <h2 class="display-h3">Nothing's open right now</h2>
      <p class="body-md" style="max-width:32rem">This reads the 7-day forecast to work out what you should be riding — which only means anything once the lifts are turning. Most resorts open in November.</p>
      <p class="body-sm" style="max-width:32rem;color:var(--text-secondary)">Come back once the season starts and it'll tell you whether Thursday is a rock-ski day or a fat-ski day.</p>
      <button class="btn btn-primary" id="quiver-offseason-plan" type="button">Plan a trip instead</button>
    </div>`;
  document.getElementById("quiver-offseason-plan").addEventListener("click", () => navigate("plan"));
}

// ---------------------------------------------------------------------------
// Step router
// ---------------------------------------------------------------------------
function renderQuiverStep() {
  const body = document.getElementById("quiver-body");
  if (!body) return;
  const step = state.quiver.step;
  if (step === "day") return renderQuiverDayStep(body);
  if (step === "result") return renderQuiverResult(body);
  return renderQuiverResortStep(body);
}

function quiverPool() {
  // Same per-resort season-window filter Chase the Snow applies in shoulder
  // season: a resort still weeks from its published open date isn't made open
  // by a forecast existing for its coordinates. Canada stays in — it has no
  // NOAA coverage, so it resolves to the typical-season path with the label
  // that comes with it, exactly as it does in Chase.
  const now = new Date();
  const shoulder = state.chaseSeasonInfo && state.chaseSeasonInfo.state === "shoulder";
  return RESORTS.filter((r) => {
    if (r.lat == null) return false;
    if (shoulder && seasonFraction(r, now) < SEASON_OPEN_FRACTION) return false;
    return true;
  });
}

// ---------------------------------------------------------------------------
// Step 1 — which mountain
// ---------------------------------------------------------------------------
function renderQuiverResortStep(body) {
  const shoulder = state.chaseSeasonInfo && state.chaseSeasonInfo.state === "shoulder";
  body.innerHTML = `
    <p class="quiver-step label">Step 1 of 2</p>
    <h1 class="display-h1 quiz-title">Where are you skiing?</h1>
    <p class="quiz-helper body-md">Pick the mountain and we'll read its forecast.</p>
    ${shoulder ? `
      <div class="canada-divider" style="margin-top:var(--space-4)">
        <span class="canada-divider__icon" aria-hidden="true">${ICONS.snow}</span>
        <div class="canada-divider__body">
          <p class="body-sm">Not every resort is open yet this time of year. This list only includes places that are typically running by now.</p>
        </div>
      </div>` : ""}
    <div class="quiver-search">
      <label class="body-sm" for="quiver-search-input">Search by name or state</label>
      <div class="quiver-search__field">
        <span class="quiver-search__icon" aria-hidden="true">${ICONS.search}</span>
        <input type="search" id="quiver-search-input" class="quiver-search__input" autocomplete="off"
               placeholder="Alta, Vermont, Jackson…" value="${escapeHtml(state.quiver.search || "")}">
      </div>
    </div>
    <p class="visually-hidden" aria-live="polite" id="quiver-search-count"></p>
    <div id="quiver-resort-list"></div>`;

  renderQuiverResortList();
  const input = document.getElementById("quiver-search-input");
  input.addEventListener("input", () => {
    state.quiver.search = input.value;
    renderQuiverResortList();
  });
}

function renderQuiverResortList() {
  const wrap = document.getElementById("quiver-resort-list");
  const q = (state.quiver.search || "").trim().toLowerCase();
  const pool = quiverPool().filter((r) => {
    if (!q) return true;
    return `${r.name} ${r.state_province} ${r.country}`.toLowerCase().includes(q);
  });

  const countEl = document.getElementById("quiver-search-count");
  if (countEl) countEl.textContent = `${pluralize(pool.length, "resort")} listed.`;

  if (!pool.length) {
    wrap.innerHTML = `<div class="center-state">${ICONS.warning}<p class="body-md">Nothing matches “${escapeHtml(state.quiver.search)}”. Try a state, or part of the mountain's name.</p></div>`;
    return;
  }

  // Grouped by state/province, which is how people actually narrow a ski
  // list — "somewhere in Utah" is a far more common starting point than a
  // specific mountain, and it keeps 71 buttons navigable by heading rather
  // than by scrolling past all of them.
  const groups = {};
  for (const r of pool) {
    const key = r.country === "Canada" ? `${r.state_province}, Canada` : r.state_province;
    (groups[key] = groups[key] || []).push(r);
  }
  const orderedKeys = Object.keys(groups).sort();

  wrap.innerHTML = orderedKeys.map((key) => `
    <section class="quiver-group">
      <h2 class="data-label quiver-group__heading">${escapeHtml(key)}</h2>
      <div class="quiver-group__items">
        ${groups[key].map((r) => `
          <button class="quiver-resort" type="button" data-rid="${r.id}">
            <span class="quiver-resort__name">${escapeHtml(r.name)}</span>
            <span class="quiver-resort__meta body-sm">${r.country === "USA" ? "Live forecast" : "Typical season only"}${r.scale === "day-trip" ? " · Day-trip hill" : ""}</span>
            <span class="quiver-resort__chev" aria-hidden="true">${ICONS.arrowRight}</span>
          </button>`).join("")}
      </div>
    </section>`).join("");

  wrap.querySelectorAll(".quiver-resort").forEach((btn) => {
    btn.addEventListener("click", () => selectQuiverResort(btn.dataset.rid));
  });
}

function selectQuiverResort(rid) {
  state.quiver.resortId = rid;
  state.quiver.dateKey = null;
  state.quiverForecast = null;
  state.quiver.step = "day";
  // Warm the forecast now rather than at the moment it's needed. The user
  // spends a few seconds on the day picker either way, and spending them
  // fetching means the answer is usually already sitting there when they
  // tap — which is the difference between this mode feeling instant and
  // feeling like Chase the Snow's cold start.
  prefetchQuiverForecast(rid);
  renderQuiverStep();
  focusHeading(mainEl());
}

let quiverFetchSeq = 0;
function prefetchQuiverForecast(rid) {
  const resort = RESORTS_BY_ID[rid];
  if (!resort) return;
  const seq = ++quiverFetchSeq;
  state.quiverForecast = { resortId: rid, status: "loading", days: null };
  resolveDailyForecast(resort, new Date()).then((res) => {
    // A stale response for a resort the user has since navigated away from
    // must not overwrite the current one.
    if (seq !== quiverFetchSeq) return;
    state.quiverForecast = { resortId: rid, status: "ready", ...res };
    if (state.route === "quiver" && state.quiver.step === "result") renderQuiverStep();
  });
}

// ---------------------------------------------------------------------------
// Step 2 — which day
//
// Deliberately shows dates only, no snow totals. Surfacing "14 inches on
// Thursday" here would turn the picker into the week-at-a-glance strip the
// Director explicitly scoped out — and it would answer the question before
// it's been asked.
// ---------------------------------------------------------------------------
function renderQuiverDayStep(body) {
  const resort = RESORTS_BY_ID[state.quiver.resortId];
  if (!resort) { state.quiver.step = "resort"; return renderQuiverStep(); }

  const now = new Date();
  const tz = (state.quiverForecast && state.quiverForecast.timeZone) || null;
  const frame = buildDayFrame(now, tz, true);

  body.innerHTML = `
    <p class="quiver-step label">Step 2 of 2</p>
    <h1 class="display-h1 quiz-title">Which day?</h1>
    <p class="quiz-helper body-md">${escapeHtml(resort.name)}, ${escapeHtml(resort.country === "Canada" ? `${resort.state_province}, Canada` : resort.state_province)}. The forecast runs seven days out.</p>
    <div class="quiver-day-list" role="radiogroup" aria-label="Which day are you skiing?">
      ${frame.map((d, i) => {
        const label = quiverDayLabel(d.dateKey, i);
        // "Try a different day" returns here with a day already chosen, so
        // the previous answer has to render as chosen — both visually and to
        // AT — rather than resetting to a blank group. Same defect class as
        // the quiz's Back-doesn't-restore-the-answer bug
        // (heuristic-evaluation.md H3/H6), avoided here by construction.
        const selected = state.quiver.dateKey === d.dateKey;
        const tabbable = state.quiver.dateKey ? selected : i === 0;
        return `<button class="tap-chip ${selected ? "tap-chip--selected" : ""}" type="button" role="radio" aria-checked="${selected}" data-daykey="${d.dateKey}" tabindex="${tabbable ? "0" : "-1"}">
          <span class="tap-chip__indicator tap-chip__indicator--radio">${ICONS.check}</span>
          <span class="tap-chip__body">
            <span class="tap-chip__label">${escapeHtml(label.primary)}</span>
            <span class="tap-chip__sublabel">${escapeHtml(label.secondary)}</span>
          </span>
        </button>`;
      }).join("")}
    </div>
    <div class="quiz-nav">
      <button class="btn btn-secondary" id="quiver-back" type="button">Back</button>
    </div>`;

  const chips = Array.from(body.querySelectorAll(".tap-chip[data-daykey]"));
  chips.forEach((chip, i) => {
    chip.addEventListener("click", () => {
      state.quiver.dateKey = chip.dataset.daykey;
      state.quiver.step = "result";
      renderQuiverStep();
    });
    // Roving tabindex, matching the quiz's radiogroup keyboard model.
    chip.addEventListener("keydown", (e) => {
      const keys = { ArrowDown: 1, ArrowRight: 1, ArrowUp: -1, ArrowLeft: -1 };
      if (!(e.key in keys)) return;
      e.preventDefault();
      const next = chips[(i + keys[e.key] + chips.length) % chips.length];
      chips.forEach((c) => { c.tabIndex = -1; });
      next.tabIndex = 0;
      next.focus();
    });
  });

  document.getElementById("quiver-back").addEventListener("click", () => {
    state.quiver.step = "resort";
    renderQuiverStep();
    focusHeading(mainEl());
  });
}

// `dateKey` is YYYY-MM-DD in the resort's own timezone. Parsed at noon local
// so that constructing a Date from it can't slip a day across the viewer's
// own UTC offset — the label has to say the same day the forecast bucketed.
function parseDayKey(dateKey) {
  const [y, m, d] = String(dateKey).split("-").map(Number);
  return new Date(y, (m || 1) - 1, d || 1, 12, 0, 0);
}

function quiverDayLabel(dateKey, index) {
  const date = parseDayKey(dateKey);
  const weekday = date.toLocaleDateString("en-US", { weekday: "long" });
  const dayMonth = date.toLocaleDateString("en-US", { month: "long", day: "numeric" });
  if (index === 0) return { primary: "Today", secondary: `${weekday}, ${dayMonth}` };
  if (index === 1) return { primary: "Tomorrow", secondary: `${weekday}, ${dayMonth}` };
  return { primary: weekday, secondary: dayMonth };
}

// ---------------------------------------------------------------------------
// Step 3 — the call
// ---------------------------------------------------------------------------
function renderQuiverResult(body) {
  const resort = RESORTS_BY_ID[state.quiver.resortId];
  if (!resort) { state.quiver.step = "resort"; return renderQuiverStep(); }

  const fc = state.quiverForecast;
  if (!fc || fc.resortId !== state.quiver.resortId || fc.status === "loading") {
    body.innerHTML = `<div class="loading-state"><div class="loading-spinner" aria-hidden="true"></div><p class="body-md">Reading the forecast for ${escapeHtml(resort.name)}…</p></div>`;
    return;
  }

  const idx = fc.days.findIndex((d) => d.dateKey === state.quiver.dateKey);
  if (idx === -1) {
    // Reached by a shared link whose day has since passed or fallen off the
    // horizon. Saying so plainly beats silently answering a different
    // question than the one the link promised.
    renderQuiverExpired(body, resort);
    return;
  }

  const day = fc.days[idx];
  const priorDays = fc.days.slice(0, idx);
  const result = quiverCheck(resort, day, priorDays, new Date());
  const c = result.conditions;
  const label = quiverDayLabel(day.dateKey, idx);
  const dayPhrase = idx === 0 ? "today" : idx === 1 ? "tomorrow" : `on ${label.primary}`;
  const location = resort.country === "Canada" ? `${resort.state_province}, Canada` : resort.state_province;

  body.innerHTML = `
    <article class="quiver-card" id="quiver-card">
      <p class="result-eyebrow label">The call</p>
      <h1 class="display-hero quiver-call" tabindex="-1">${escapeHtml(result.call.label)}</h1>
      <p class="quiver-call__tagline body-md">${escapeHtml(result.call.tagline)} <span class="data-inline quiver-call__waist">${escapeHtml(result.call.waistLabel)}</span></p>
      <p class="quiver-context body-md">${escapeHtml(resort.name)}, ${escapeHtml(location)} — ${escapeHtml(dayPhrase)}, ${escapeHtml(label.secondary)}.</p>

      ${quiverFreshnessHtml(fc)}

      <h2 class="display-h3 reason-heading">Why</h2>
      <ul class="reason-list">
        ${result.reasons.map((r) => `<li class="reason-bullet"><span class="reason-bullet__icon">${ICONS.checkCircle}</span><span class="reason-bullet__text body-md">${escapeHtml(r)}</span></li>`).join("")}
      </ul>

      <div class="quiver-whatis">
        <h2 class="data-label">What that ski is</h2>
        <p class="body-md">${escapeHtml(result.call.plain)}</p>
      </div>

      <div class="quiver-fallback">
        <h2 class="data-label">If you don't own a pair</h2>
        <p class="body-md">${escapeHtml(result.call.ifYouDont)}</p>
      </div>

      ${result.aside ? `
        <div class="quiver-aside">
          <h2 class="data-label">${escapeHtml(result.aside.label)}</h2>
          <p class="body-md">${escapeHtml(result.aside.text)}</p>
        </div>` : ""}

      <h2 class="display-h3" style="margin-bottom:var(--space-3)">The numbers</h2>
      <div class="stat-strip stat-strip--quad">${quiverStatsHtml(c)}</div>

      ${result.caveats.length ? `
        <div class="quiver-caveats">
          <h2 class="data-label">Worth knowing</h2>
          <ul class="quiver-caveat-list">
            ${result.caveats.map((t) => `<li class="body-md"><span class="quiver-caveat__icon" aria-hidden="true">${ICONS.warning}</span><span>${escapeHtml(t)}</span></li>`).join("")}
          </ul>
        </div>` : ""}

      <p class="quiver-limits body-sm">This reads the weather forecast, not the mountain's snow report. It doesn't know the settled base depth, what got groomed last night, or what's already been tracked out. Check the resort's own report before you pack.</p>

      ${resort.hot_take ? `
        <div class="hot-take" id="quiver-hot-take">
          <span class="hot-take__quote-mark" aria-hidden="true">&ldquo;</span>
          <div class="hot-take__header">
            <span class="hot-take__avatar" aria-hidden="true">N</span>
            <span class="hot-take__label label">Nicole's Hot Take</span>
          </div>
          <p class="hot-take__body">${escapeHtml(resort.hot_take.text)}</p>
          <span class="hot-take__attribution">— Nicole, on ${escapeHtml(resort.name)}</span>
        </div>` : ""}

      <div class="footer-cta">
        <button class="btn btn-primary btn-block" id="quiver-share" type="button">${ICONS.share} Share this call</button>
        <button class="btn btn-secondary btn-block" id="quiver-another-day" type="button">Try a different day</button>
        <button class="btn-text" id="quiver-another-resort" type="button" style="text-align:center">Check a different mountain →</button>
      </div>
    </article>`;

  document.getElementById("quiver-share").addEventListener("click", () => shareQuiverCall(resort, result, day, idx));
  document.getElementById("quiver-another-day").addEventListener("click", () => {
    state.quiver.step = "day";
    renderQuiverStep();
    focusHeading(mainEl());
  });
  document.getElementById("quiver-another-resort").addEventListener("click", () => {
    state.quiver.step = "resort";
    state.quiver.resortId = null;
    renderQuiverStep();
    focusHeading(mainEl());
  });

  const retry = document.getElementById("quiver-retry-forecast");
  if (retry) retry.addEventListener("click", () => {
    prefetchQuiverForecast(state.quiver.resortId);
    renderQuiverStep();
  });

  document.title = `${result.call.label} — ${resort.name}`;
  setOgMeta({
    title: `${result.call.label} at ${resort.name}`,
    description: `${result.reasons[0] || ""} ${result.call.waistLabel}.`.trim(),
  });

  syncQuiverHash(resort, day);
  announce("reveal-announcer", `The call for ${resort.name} ${dayPhrase}: ${result.call.label}. ${result.call.waistLabel}.`);
  revealQuiverCard(document.getElementById("quiver-card"));
  const heading = body.querySelector(".quiver-call");
  if (heading) heading.focus({ preventScroll: true });
}

function quiverFreshnessHtml(fc) {
  if (fc.isLive) {
    return `<div class="freshness-badge"><span>${ICONS.live}</span><span class="freshness-badge__text body-sm">Live forecast · updated moments ago</span></div>`;
  }
  return `<div class="freshness-badge freshness-badge--fallback">
      <span>${ICONS.signalSlash}</span>
      <span class="freshness-badge__text body-sm">Not a live forecast</span>
    </div>
    <p class="body-sm" style="color:var(--text-secondary);margin:0 0 var(--space-4)">${
      fc.fallbackReason === "outside NOAA coverage"
        ? "The live forecast service only covers the US, so this is built from typical snowfall for this time of year rather than this week's weather."
        : `We couldn't reach the live forecast right now, so this is typical snowfall for this time of year rather than this week's. <button class="btn-text" id="quiver-retry-forecast" type="button" style="padding:0">Try again</button>`
    }</p>`;
}

// Snow depths render through the same rounding rule the reason sentences use
// (whole inches above one, a single decimal below), so a figure quoted in the
// prose and the same figure in the tile beside it never disagree — "22\" of
// new snow in total" above a tile reading 21.9 reads as a defect, not as
// precision.
function quiverDepth(n) {
  if (n == null) return "—";
  return n < 1 ? String(Math.round(n * 10) / 10) : String(Math.round(n));
}

function quiverStatsHtml(c) {
  let html = "";
  html += statTile("New snow, your day", quiverDepth(c.newSnow), '"', c.newSnow < 0.5 ? "Nothing forecast" : null, false);
  html += statTile("Storm total", quiverDepth(c.stormTotal), '"', c.leadDaysObserved > 0 ? `Including the ${pluralize(c.leadDaysObserved, "day")} before` : "Your day only — no lead-in visible", false);
  html += statTile("High", c.highF, "°F", c.lowF != null ? `Low ${c.lowF}°F` : null, c.highF == null);
  html += c.slr != null
    ? statTile("Snow to water", `${c.slr}:1`, "", capitalize(c.density.word), false)
    : textStatTile("Snow type", capitalize(c.density.word));
  return html;
}

function renderQuiverExpired(body, resort) {
  body.innerHTML = `
    <div class="center-state">
      ${ICONS.warning}
      <h1 class="display-h3">That day's out of range</h1>
      <p class="body-md" style="max-width:32rem">This link was for a specific day at ${escapeHtml(resort.name)}, and the forecast only runs seven days ahead — so that day has either passed or hasn't come into range yet.</p>
      <button class="btn btn-primary" id="quiver-expired-again" type="button">Check ${escapeHtml(resort.name)} for this week</button>
    </div>`;
  document.getElementById("quiver-expired-again").addEventListener("click", () => {
    state.quiver.step = "day";
    state.quiver.dateKey = null;
    renderQuiverStep();
    focusHeading(mainEl());
  });
}

// ---------------------------------------------------------------------------
// Sharing
//
// The share token carries the resort and the date — never the conditions or
// the call itself. A ski recommendation is only true for as long as the
// forecast behind it is, so a recipient opening this tomorrow re-reads the
// forecast and may correctly see a different answer. Freezing the call into
// the URL the way the trip planner freezes its result would produce a link
// that confidently states yesterday's weather, which R8 forbids.
// ---------------------------------------------------------------------------
function buildQuiverToken(resort, day) {
  return b64urlEncode(JSON.stringify({ v: 1, rid: resort.id, d: day.dateKey }));
}

function syncQuiverHash(resort, day) {
  history.replaceState(null, "", "#quiver=" + buildQuiverToken(resort, day));
}

async function shareQuiverCall(resort, result, day, idx) {
  const url = `${location.origin}${location.pathname}#quiver=${buildQuiverToken(resort, day)}`;
  const dayPhrase = idx === 0 ? "today" : idx === 1 ? "tomorrow" : quiverDayLabel(day.dateKey, idx).primary;
  const text = `${resort.name}, ${dayPhrase}: ${result.call.label}. ${result.call.waistLabel}.`;
  try {
    if (navigator.share) {
      await navigator.share({ title: `${result.call.label} at ${resort.name}`, text, url });
      return;
    }
    await navigator.clipboard.writeText(`${text}\n${url}`);
    showToast("Link copied — it'll re-read the forecast when they open it.");
  } catch (e) {
    if (e && e.name === "AbortError") return; // user dismissed the share sheet
    showToast("Couldn't copy the link. You can copy it from the address bar.");
  }
}

function revealQuiverCard(card) {
  if (!card) return;
  const reduce = reduceMotion();
  const targets = card.querySelectorAll(".result-eyebrow, .quiver-call, .quiver-call__tagline, .quiver-context, .reason-bullet");
  targets.forEach((el, i) => {
    if (reduce) { el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 160, easing: "ease", fill: "both" }); return; }
    el.animate(
      [{ opacity: 0, transform: "translateY(6px)" }, { opacity: 1, transform: "translateY(0)" }],
      { duration: 200, delay: Math.min(i, 6) * 45, easing: "cubic-bezier(.16,1,.3,1)", fill: "both" }
    );
  });
}

</script>
<script>
// ---------------------------------------------------------------------------
// Nicole's List — a browsable, filterable reference. Not a peer recommender:
// "not a ranked list, just her record" (copy-deck §7). Real <table> markup
// per the copy deck's own screen-reader dry-run (caption + scope="col"
// headers), styled to the calmer "browse and trust" register.
//
// v2 (design review 2026-08-05) — Verdict + Take:
//   * The click is gone. Takes render in full at every row; nothing is
//     truncated at runtime. The old 58-char preview was systematically
//     biased — six of the nine takes are structured praise-then-caveat, so
//     clipping deleted the caveat every time, and Breckenridge's pan read
//     as a compliment.
//   * Two tiers. A short verdict line (the decision) is the scan stripe;
//     the take (the texture) sits under it. Authoring limits: verdict
//     18-40, take 45-95, combined <= 130. Enforced when writing, never by
//     the renderer.
//   * The per-row "Nicole's take" label is gone at the Director's call —
//     it was repetitive and ate the space the verdict needs. R5 is now
//     carried at page level instead: a first-person standing line, an
//     honest coverage count, and a visually-hidden per-row attribution so
//     a screen-reader user landing mid-list still knows whose voice this
//     is. THIS PAGE ONLY — the recommendation and quiver screens keep the
//     labelled, quarantined hot-take block.
//   * Column order is Place / Nicole's take / Best for / Region so DOM
//     order matches visual order at both breakpoints (1.3.2), rather than
//     reordering cards with flex `order`.
// ---------------------------------------------------------------------------

function buildNicolesRows() {
  return NICOLES_LIST.map((row) => {
    const resort = row.resort_id ? RESORTS_BY_ID[row.resort_id] : null;
    return {
      place: resort ? resort.name : row.resort_place,
      region: row.region_state,
      rating: row.overall_rating,
      verdict: row.nicoles_verdict,
      take: row.nicoles_take,
      tags: resort ? (resort.best_for_tags || []) : [],
      scale: resort ? resort.scale : null,
      country: resort ? resort.country : null,
      resortId: row.resort_id,
    };
  });
}

function renderNicolesList(main) {
  const rows = buildNicolesRows();
  const regions = ["all", ...Array.from(new Set(rows.map((r) => r.region))).sort()];

  main.innerHTML = `
    <div class="page-column">
      <h1 class="display-h1">Nicole's list</h1>
      <p class="nicoleslist-voice body-md">Everywhere I've skied, and what I <strong>actually</strong> think. Not a ranked list, just my record — and some of these aren't flattering.</p>
      <p class="nicoleslist-status data-label">${rows.filter((r) => r.take).length} of ${rows.length} written so far</p>
      <div class="nicoleslist-filters" role="group" aria-label="Filter Nicole's list">
        ${regions.map((r) => `<button class="filter-chip ${state.nicolesFilters.region === r ? "filter-chip--selected" : ""}" data-region="${escapeHtml(r)}" type="button" aria-pressed="${state.nicolesFilters.region === r}">${r === "all" ? "All regions" : escapeHtml(r)}</button>`).join("")}
      </div>
      ${rows.some((r) => r.scale === "day-trip" || (r.country && r.country !== "USA" && r.country !== "Canada")) ? `<p class="body-sm" style="color:var(--text-secondary);margin-bottom:var(--space-4)"><span class="info-badge">Day-trip hill</span> / <span class="info-badge">International</span> — not part of the trip-planner or snow-chase matches — just her record.</p>` : ""}
      <div id="nicoles-table-wrap"></div>
    </div>`;

  document.querySelectorAll(".filter-chip[data-region]").forEach((btn) => {
    btn.addEventListener("click", () => { state.nicolesFilters.region = btn.dataset.region; renderNicolesTable(rows); syncFilterChips(); });
  });

  renderNicolesTable(rows);
  document.title = "Nicole's list — find your next ski trip";
  setOgMeta({ title: "Find your next ski trip", description: "Everywhere Nicole's actually skied, with her real takes where she has one." });
  focusHeading(main);
}

function syncFilterChips() {
  document.querySelectorAll(".filter-chip[data-region]").forEach((btn) => {
    const selected = btn.dataset.region === state.nicolesFilters.region;
    btn.classList.toggle("filter-chip--selected", selected);
    btn.setAttribute("aria-pressed", String(selected));
  });
}

// Responsive treatment (design-critic.md finding 5/6, accessibility-review.md
// M6/M8 fixes): this is a real <table> at every width — <caption>,
// scope="col" headers, and explicit `role`s on every table element — so a
// screen reader always gets genuine table semantics (column context per
// cell, row/column counts) regardless of how the CSS displays it. Below the
// card breakpoint (styles.css), the same markup is restyled into one card
// per row via CSS alone; the explicit roles keep that restyling from
// silently stripping table semantics for AT the way plain `display: block`
// on table elements can. `data-label` attributes drive the visible
// per-field label in the card layout (CSS `content: attr(data-label)`) —
// redundant with, not a replacement for, the real column headers.
function renderNicolesTable(rows) {
  const wrap = document.getElementById("nicoles-table-wrap");
  const filtered = state.nicolesFilters.region === "all" ? rows : rows.filter((r) => r.region === state.nicolesFilters.region);

  wrap.innerHTML = `
    <div class="nicoles-table-scroll">
      <table class="nicoles-table" role="table">
        <caption class="visually-hidden">Nicole's ski history, ${filtered.length} places</caption>
        <thead class="nicoles-table__head">
          <tr role="row">
            <th scope="col" role="columnheader" class="data-label">Place</th>
            <th scope="col" role="columnheader" class="data-label">Nicole's take</th>
            <th scope="col" role="columnheader" class="data-label">Best for</th>
            <th scope="col" role="columnheader" class="data-label">Region</th>
          </tr>
        </thead>
        <tbody role="rowgroup">
          ${filtered.map(nicolesRowHtml).join("")}
        </tbody>
      </table>
    </div>`;
}

function nicolesRowHtml(row) {
  const badges = [];
  if (row.scale === "day-trip") badges.push(`<span class="info-badge" aria-label="Day-trip hill. Not part of the trip-planner or snow-chase matches — just her record">Day-trip hill</span>`);
  if (row.country && row.country !== "USA" && row.country !== "Canada") badges.push(`<span class="info-badge" aria-label="International. Not part of the trip-planner or snow-chase matches — just her record">International</span>`);

  // M6 fix: tags used to be plain <span>s joined with an empty string, which
  // concatenated into unparseable run-on text for a screen reader (e.g.
  // "deep powderbig vertbackcountry access"). A real <ul>/<li> list gives AT
  // a genuine "list of N items" with real boundaries between items, not just
  // a CSS gap that only sighted users can see. `role="list"`/"listitem" are
  // explicit because `list-style: none` silently drops the implicit list
  // role in some browser/AT combinations (a known Safari/VoiceOver gotcha).
  const tagsHtml = row.tags.length
    ? `<ul class="tag-row" role="list">${row.tags.slice(0, 4).map((t) => `<li class="pill-tag" role="listitem">${escapeHtml(t.replace(/-/g, " "))}</li>`).join("")}</ul>`
    : `<span class="body-sm data-gap">—</span>`;

  // No truncation and no disclosure control. The visually-hidden prefix is
  // what keeps R5 intact now that the visible per-row label is gone: a
  // screen-reader user who jumps straight to a resort by heading, or who
  // never heard the page intro, still gets "Nicole's take:" before the
  // opinion — otherwise a pan like "My least favorite in CO" is announced
  // in the app's own neutral voice.
  //
  // A negative take renders identically to a positive one. No sentiment
  // colour, no icon, no rating glyph: takes carry zero ranking weight
  // (engine.js), sentiment styling would fail 1.4.1, and it would make an
  // honest pan look like a validation error.
  const takeHtml = row.take
    ? `<span class="visually-hidden">Nicole's take on ${escapeHtml(row.place)}: </span>
       ${row.verdict ? `<p class="take-verdict">${escapeHtml(row.verdict)}</p>` : ""}
       <p class="take-body body-sm">${escapeHtml(row.take)}</p>
       ${row.rating ? `<p class="data-inline take-rating">${escapeHtml(String(row.rating))}/10</p>` : ""}`
    : `<span class="take-empty body-sm">No take yet</span>`;

  return `
    <tr role="row" class="nicoles-table__row">
      <td role="cell" class="nicoles-table__cell nicoles-table__cell--place">
        <span class="display-h3" style="display:block">${escapeHtml(row.place)}</span>
        ${badges.length ? `<div class="nicoles-badges" style="margin-top:var(--space-1)">${badges.join("")}</div>` : ""}
      </td>
      <td role="cell" class="nicoles-table__cell nicoles-table__cell--take" data-label="Nicole's take">${takeHtml}</td>
      <td role="cell" class="nicoles-table__cell" data-label="Best for">${tagsHtml}</td>
      <td role="cell" class="nicoles-table__cell nicoles-table__cell--region" data-label="Region"><span class="body-sm" style="color:var(--text-secondary)">${escapeHtml(row.region)}</span></td>
    </tr>`;
}

</script>
<script>
document.querySelectorAll('.nav-item').forEach((btn) => {
  btn.addEventListener('click', () => navigate(btn.dataset.route));
});

// Global error boundary: if anything truly unexpected throws during
// rendering, surface copy-deck's error.generic rather than a blank/broken
// screen — every other failure mode in this app (NOAA, share) already has
// its own honest, specific handling; this is the last-resort catch-all.
window.addEventListener('error', (e) => {
  const main = document.getElementById('app-main');
  if (main && !main.querySelector('.center-state')) {
    main.innerHTML = `<div class="page-column"><div class="center-state">${ICONS.warning}
      <p class="body-md">Something didn't load. Check your connection and try again.</p>
      <button class="btn btn-primary" id="global-retry" type="button">Try again</button>
    </div></div>`;
    const retry = document.getElementById('global-retry');
    if (retry) retry.addEventListener('click', () => { navigate('splash'); });
  }
});

parseInitialRoute();
render();
// A #quiver= share link needs its forecast fetched before the call can be
// rendered; parseInitialRoute() flags it, and this is the first point at
// which app-quiver.js is guaranteed to be defined.
if (quiverPendingPrefetch) prefetchQuiverForecast(quiverPendingPrefetch);
if (resumedQuizFromLink) {
  // Defense-in-depth for the URL-hash quiz-progress fix: a focus/DOM move
  // alone doesn't tell a user resuming from a reload *that* they resumed —
  // this is an explicit, visible acknowledgment rather than a silent
  // restore (heuristic-evaluation.md's stated preference either way).
  showToast("Welcome back — picking up where you left off.");
}
</script>
</body>
</html>
