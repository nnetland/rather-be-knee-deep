  return `<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="${uid}-title ${uid}-desc">
  <title id="${uid}-title">${name} badge</title>
  <desc id="${uid}-desc">${layers.map(l=>MOTIF_DESC[l.motif]||l.motif).join('; ')} on a ${pal.meaning} background.</desc>
  <defs>
    <path id="${arcId}" d="M 34,168 A 96,96 0 0 0 206,168"/>
    <clipPath id="clip-${uid}"><circle cx="120" cy="120" r="109"/></clipPath>
  </defs>
  <circle cx="120" cy="120" r="119" fill="${WHITE}" stroke="${'#00000014'}" stroke-width="1"/>
  <circle cx="120" cy="120" r="109" fill="${pal.bg}"/>
  <g clip-path="url(#clip-${uid})">
    ${layerMarkup}
    <text font-family="Manrope, sans-serif" font-weight="800" font-size="${fontSize}" letter-spacing="${letterSpace}" fill="${WHITE}" style="paint-order:stroke; stroke:rgba(0,0,0,0.22); stroke-width:2.5px;">
      <textPath href="#${arcId}" startOffset="50%" text-anchor="middle"${textLengthAttr}>${label}</textPath>
    </text>
  </g>
</svg>`;

};/* ============================================================
   REGION LABEL + REGION CLUSTER — ported from badge-preview.html's
   region()/regionCluster(), adapted to read the real resorts.json field
   names (state_province/country) directly instead of the preview's trimmed
   sp/country stand-ins. Region label drives the curved badge type; region
   cluster drives ONLY the repeat-check / cluster-dedupe below (badge-
   system.md §4.1's "six region clusters a user would actually cross-shop on
   one trip") — never palette or motif rule logic, which still key off the
   exact state/country fields, matching the preview's own documented split.
   ============================================================ */
function badgeRegionLabel(resort) {
  const sp = resort.state_province, country = resort.country;
  const west = { 'California': 'Sierra, CA', 'Oregon': 'Cascades, OR', 'Washington': 'Cascades, WA' };
  const rockies = { 'Colorado': 'Rockies, CO', 'Wyoming': 'Rockies, WY', 'Montana': 'Rockies, MT', 'Idaho': 'Rockies, ID', 'Utah': 'Wasatch, UT', 'New Mexico': 'Rockies, NM' };
  const midwest = { 'Minnesota': 'Midwest, MN', 'Michigan': 'Midwest, MI', 'Wisconsin': 'Midwest, WI' };
  const northeast = { 'Vermont': 'New England, VT', 'Maine': 'New England, ME', 'New Hampshire': 'New England, NH', 'Connecticut': 'New England, CT' };
  const canada = { 'British Columbia': 'BC, Canada', 'Alberta': 'Alberta, Canada', 'Quebec': 'Quebec, Canada' };
  if (sp === 'Alaska') return 'Alaska';
  return west[sp] || rockies[sp] || midwest[sp] || northeast[sp] || canada[sp] || sp || country || '';
}

function badgeRegionCluster(resort) {
  const sp = resort.state_province;
  if (['Colorado', 'Wyoming', 'Montana', 'Idaho', 'Utah', 'New Mexico'].includes(sp)) return 'Rockies + Wasatch';
  if (['California', 'Oregon', 'Washington'].includes(sp)) return 'West Coast (Sierra + Cascades)';
  if (['Minnesota', 'Michigan', 'Wisconsin'].includes(sp)) return 'Midwest';
  if (['Vermont', 'Maine', 'New Hampshire', 'Connecticut'].includes(sp)) return 'New England';
  if (['British Columbia', 'Alberta', 'Quebec'].includes(sp)) return 'Canada';
  if (sp === 'Alaska') return 'Alaska';
  return 'Other';
}

/* ============================================================
   ASSIGNMENT ENGINE (rule-driven tier) — priority-ordered, first match wins
   for the PRIMARY motif, ported from badge-preview.html's
   assignRuleBased(), adapted to the real resorts.json field names
   (best_for_tags/state_province/cost_tier/crowd_level/scale in place of the
   preview's trimmed tags/sp/cost/crowd stand-ins).

   One rule ADDED for the full build that the preview's simplified engine
   explicitly couldn't run (badge-system.md §4.2: "design-builder should add
   this as priority-0... at full build time, with the complete resorts.json
   record available"): a free-text ranching/Western-town signal, matched
   against the real town_vibe/character_note strings. It is priority-0 (runs
   before every other rule, including the name-pun check) because it's the
   same kind of signal that got Jackson Hole and Steamboat hand-tuned rather
   than rule-matched. Checked against the actual 71-resort dataset before
   shipping: it does not misfire on any non-hand-tuned resort (Big Powderhorn
   Mountain's "western Upper Peninsula" is a false-positive risk for a bare
   /western/ match, which is why this only matches the tighter
   ranch/rodeo/cowboy word-boundary set, not "western" alone — see
   build-notes.md).
   ============================================================ */
function badgeAssignRuleBased(r) {
  const t = r.best_for_tags || [];
  const has = (...xs) => xs.every((x) => t.includes(x));
  const vibeText = ((r.town_vibe || '') + ' ' + (r.character_note || '')).toLowerCase();
  let primary, rule;

  if (/\b(ranch|rodeo|cowboy)\b/.test(vibeText)) { primary = 'lassocowgirl'; rule = 'free-text: ranching/Western-town signal (town_vibe/character_note)'; }
  else if (r.id.includes('wolf')) { primary = 'wolf'; rule = 'name pun: "Wolf" in resort name'; }
  else if (r.state_province === 'New Mexico') { primary = 'roadrunner'; rule = 'region: high desert Southwest'; }
  else if (r.state_province === 'Alaska') { primary = 'polarbear'; rule = 'region: Alaska'; }
  else if (['Michigan', 'Minnesota', 'Wisconsin'].includes(r.state_province)) { primary = 'moose'; rule = 'region: Midwest / Great Lakes'; }
  else if (t.includes('deep-powder') && (r.crowd_level === 'low' || r.scale === 'regional')) { primary = 'snorkel'; rule = 'deep-powder + low crowd/regional'; }
  else if (has('steeps', 'backcountry-access')) { primary = 'goat'; rule = 'steeps + backcountry-access'; }
  else if (t.includes('luxury') && (t.includes('skier-only') || r.cost_tier === '$$$$')) { primary = 'penguin'; rule = 'luxury + skier-only/$$$$'; }
  else if (t.includes('beginner-friendly') || (t.includes('family') && r.scale === 'day-trip')) { primary = 'retriever'; rule = 'beginner-friendly, or family + day-trip'; }
  else if (t.includes('apres-scene') && (r.crowd_level === 'high' || r.crowd_level === 'brutal')) { primary = 'bro'; rule = 'apres-scene + high/brutal crowd'; }
  else if (has('quiet', 'uncrowded')) { primary = 'fox'; rule = 'quiet + uncrowded'; }
  else if (t.includes('spring-skiing')) { primary = 'sunbear'; rule = 'spring-skiing'; }
  else if (t.includes('big-vert') && r.scale === 'destination') { primary = 'yeti'; rule = 'big-vert + destination scale'; }
  else { primary = 'snowball'; rule = 'no strong signal → fallback'; }

  const layers = [{ motif: primary, box: P }];
  const accentNotes = [];
  if (t.includes('night-skiing')) { layers.push({ motif: 'lamps', box: [120, 26, 0.85, 0] }); accentNotes.push('+ night-skiing lamps'); }
  if (t.includes('skier-only') && primary !== 'penguin') { layers.push({ motif: 'noboard', box: [182, 166, 0.42, 0] }); accentNotes.push('+ no-board slash'); }
  if (t.includes('tree-skiing') && primary !== 'moose') { layers.push({ motif: 'pines', box: [186, 150, 0.5, 0] }); accentNotes.push('+ pines'); }
  if (t.includes('deep-powder') && primary !== 'snorkel') { layers.push({ motif: 'plume', box: [120, 182, 0.85, 0] }); accentNotes.push('+ powder plume'); }
  if (/\bolympic\b/i.test(r.character_note || '')) { layers.push({ motif: 'medal', box: [182, 70, 0.5, -8] }); accentNotes.push('+ Olympic medal'); }

  return { paletteKey: BADGE_PALETTE_BY_MOTIF[primary] || 'indigo', layers, rule, primary, accentNotes };
}

/* ============================================================
   REGION-CLUSTER MOTIF DEDUPE — badge-system.md §4.2 option (b), built for
   real: after every resort has a primary motif (hand-tuned entries fixed,
   rule-driven entries from badgeAssignRuleBased above), walk each of the six
   region clusters and make sure no character motif appears twice within it.

   Hand-tuned entries are processed FIRST (in dataset order) to seed each
   cluster's "already used" set — their motifs are the spec's own explicit,
   considered choices (badge-system.md §6) and are never themselves bumped.
   Rule-driven/fallback entries are then processed in the same fixed dataset
   order and, on collision, bumped to the next available motif: first from a
   same-flavour BADGE_MOTIF_POOLS pool, then (if that pool is exhausted
   within this cluster) from the full BADGE_CHARACTER_ORDER library, walked
   starting at a deterministic hash-of-resort-id offset. Never randomness,
   never resolved at render time — this runs once, over the static dataset,
   exactly like the adjacency palette dedupe it's modelled on.
   ============================================================ */
function badgeDedupeClusterMotifs(list) {
  const usedByCluster = {};
  const markUsed = (cluster, motif) => {
    if (!usedByCluster[cluster]) usedByCluster[cluster] = new Set();
    usedByCluster[cluster].add(motif);
  };
  const isUsed = (cluster, motif) => !!(usedByCluster[cluster] && usedByCluster[cluster].has(motif));

  list.forEach((x) => { if (x.category === 'hand-tuned') markUsed(x.cluster, x.layers[0].motif); });

  list.forEach((x) => {
    if (x.category === 'hand-tuned') return;
    const original = x.layers[0].motif;
    if (!isUsed(x.cluster, original)) { markUsed(x.cluster, original); return; }

    let chosen = null;
    const pool = BADGE_MOTIF_POOLS[original] || [];
    for (const cand of pool) { if (!isUsed(x.cluster, cand)) { chosen = cand; break; } }
    if (!chosen) {
      const offset = hashStr(x.resort.id + '-cluster-dedupe') % BADGE_CHARACTER_ORDER.length;
      for (let k = 0; k < BADGE_CHARACTER_ORDER.length; k++) {
        const cand = BADGE_CHARACTER_ORDER[(offset + k) % BADGE_CHARACTER_ORDER.length];
        if (!isUsed(x.cluster, cand)) { chosen = cand; break; }
      }
    }
    if (chosen && chosen !== original) {
      x.layers = [{ ...x.layers[0], motif: chosen }, ...x.layers.slice(1)];
      x.paletteKey = BADGE_PALETTE_BY_MOTIF[chosen] || x.paletteKey;
      x.clusterBumped = true;
      x.clusterBumpFrom = original;
    }
    markUsed(x.cluster, x.layers[0].motif);
  });
}

  }
  const a = badgeAssignRuleBased(r);
  const cat = a.primary === 'snowball' ? 'fallback' : 'rule';
  return { resort: r, cluster, category: cat, paletteKey: a.paletteKey, layers: a.layers, why: a.rule, accentNotes: a.accentNotes };
});

badgeDedupeClusterMotifs(BADGE_ASSIGNED);
dedupeAdjacentPalettes(BADGE_ASSIGNED);

const BADGE_ASSIGNMENTS = Object.fromEntries(BADGE_ASSIGNED.map((a) => [a.resort.id, a]));

/* ============================================================
   PUBLIC API used by app.js / app-chase.js / app-nicoles.js
   ============================================================ */

// Deterministic per resort+context uid — NOT a running counter (the preview
// used `uidCounter++`, which is fine for a one-shot static page but would
// break the byte-identical-across-two-browser-contexts requirement here,
// since a counter's value depends on how many other badges happened to
// render earlier on that particular page load). `context` only needs to be
// unique per *distinct simultaneous usage* of the same resort's badge on one
// page (e.g. a Chase row vs. that same resort's hero card) — it never
// varies with session, load order, or shared-link vs. fresh-render state.
// `decorative` (default true) matches this app's existing illustration
// convention (see the old illustrations.js's own `aria-hidden="true"
// focusable="false"` on its <svg>, and verify_a11y.js's check for it): the
// containing element carries the accessible name/description
// (role="img" + aria-label — hero card — or aria-hidden entirely on a
// decorative list-row avatar), and the inner SVG is hidden from the
// accessibility tree so a screen reader doesn't encounter the badge's own
// <title>/<desc> AND the wrapper's label as two separate, redundant stops.
// Pass { decorative: false } to keep the SVG's own role="img"
// aria-labelledby (its <title>/<desc>) live — used by the verification
// suite to check the title/desc content directly.
function badgeSvg(resort, context, opts) {
  const a = BADGE_ASSIGNMENTS[resort.id];
  if (!a) return '';
  const uid = `bdg-${resort.id}-${context || 'default'}`;
  const svg = buildBadgeSVG({ paletteKey: a.paletteKey, layers: a.layers, name: resort.name, region: badgeRegionLabel(resort), uid });
  const decorative = !opts || opts.decorative !== false;
  if (!decorative) return svg;
  return svg.replace(`role="img" aria-labelledby="${uid}-title ${uid}-desc"`, 'aria-hidden="true" focusable="false"');
}

// Alt text / screen-reader description — badge-system.md §8: states the
// actual character content in plain language plus the background's
// *meaning*, never its hex, generated from the same MOTIF_DESC table that
// drives the visual so text and picture can never drift apart. Pattern
// matches copy-deck.md §8 (describes what the picture is *for*, carries the
// resort's character, not a literal shape-by-shape inventory).
function badgeAltText(resort) {
  const a = BADGE_ASSIGNMENTS[resort.id];
  if (!a) return `${resort.name} badge.`;
  const parts = a.layers.map((l) => MOTIF_DESC[l.motif] || l.motif);
  const pal = PALETTES[a.paletteKey] || PALETTES.indigo;
  return `${resort.name} badge: ${parts.join('; ')} — on a ${pal.meaning} background.`;
}

// Short, non-repetitive alt text for dense repeated contexts (Chase-the-Snow
// list rows) — see build-notes.md for why the full badgeAltText() sentence
// is used on the hero result card (one badge, one reveal moment) but this
// shorter form is used where the badge is decorative-adjacent to already-
// present row text. Currently unused directly (Chase rows mark the avatar
// aria-hidden, per the same reasoning as the row's own rank number and
// forecast icon — see build-notes.md's accessibility section) but kept
// available for any future context that wants a mid-length description
// without the full character+background sentence.
function badgeShortAltText(resort) {
  const a = BADGE_ASSIGNMENTS[resort.id];
  if (!a) return `${resort.name} badge.`;
  return `${resort.name} badge: ${MOTIF_DESC[a.layers[0].motif] || a.layers[0].motif}.`;
}

</script>
<script>
// ---------------------------------------------------------------------------
// Matching engines — implements docs/designpowers/strategy.md §3 (Plan a Trip)
// and §4 (Chase the Snow) exactly as specified. Mixed-ability scoring is a
// min-max bottleneck function, never an average (§3.2) — this is the app's
// differentiator and it is implemented literally as Math.min(floor, ceiling).
// ---------------------------------------------------------------------------

const SKILL_LEVELS = ["never-skied", "beginner", "intermediate", "advanced", "expert"];
const SKILL_LABEL = {
  "never-skied": "never skied before",
  "beginner": "beginner",
  "intermediate": "intermediate",
  "advanced": "advanced",
  "expert": "expert",
};
const COST_TIERS = ["$", "$$", "$$$", "$$$$"];
const FIELD_STRENGTH = { strong: 10, decent: 6, weak: 2 };

function haversineMiles(lat1, lon1, lat2, lon2) {
  if (lat1 == null || lon1 == null || lat2 == null || lon2 == null) return null;
  const R = 3958.8;
  const toRad = (d) => (d * Math.PI) / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function clamp01(v) { return Math.max(0, Math.min(1, v)); }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

// --- Null-safe terrain scoring (strategy.md §3.6) ---------------------------
// Never treats a null terrain_pct as zero or a negative signal. When null,
// the level score falls back entirely to editorial fields (renormalized to
// 100% weight instead of the usual blend), never guessed or interpolated.
function editorialLevelScore(resort, level) {
  const bf = FIELD_STRENGTH[resort.beginner_friendliness] ?? 5;
  const fs = FIELD_STRENGTH[resort.family_ski_school] ?? 5;
  const tags = resort.best_for_tags || [];
  const expertTagHits = ["steeps", "tree-skiing", "deep-powder", "big-vert", "backcountry-access"]
    .filter((t) => tags.includes(t)).length;

  if (level === "never-skied") return clamp(bf * 0.65 + fs * 0.35, 0, 10);
  if (level === "beginner") return clamp(bf * 0.7 + fs * 0.3, 0, 10);
  if (level === "intermediate") {
    const groomerBonus = tags.includes("long-groomers") ? 1.5 : 0;
    return clamp(bf * 0.35 + fs * 0.15 + 4 + groomerBonus, 0, 10);
  }
  // advanced / expert
  const tagWeight = level === "expert" ? 0.4 : 0.25;
  return clamp(4 + expertTagHits * 1.6 * (1 + tagWeight), 0, 10);
}

function terrainPctLevelScore(resort, level) {
  if (!resort.terrain_pct) return null;
  const { beginner, intermediate, advanced_expert } = resort.terrain_pct;
  if (level === "never-skied" || level === "beginner") return clamp((beginner / 25) * 10, 0, 10);
  if (level === "intermediate") return clamp((intermediate / 45) * 10, 0, 10);
  return clamp((advanced_expert / 50) * 10, 0, 10); // advanced / expert
}

/** How well a resort serves a skier at a given level, 0-10. Null-safe. */
function levelScore(resort, level) {
  const editorial = editorialLevelScore(resort, level);
  const pct = terrainPctLevelScore(resort, level);
  if (pct === null) return editorial; // renormalized basis — no zero penalty for missing data
  return clamp(pct * 0.6 + editorial * 0.4, 0, 10);
}

// --- Terrain & skill fit (35 pts) — the differentiator ----------------------
function terrainSkillScore(resort, answers) {
  const levels = answers.skillLevels && answers.skillLevels.length
    ? answers.skillLevels
    : ["intermediate"];
  const sorted = [...levels].sort((a, b) => SKILL_LEVELS.indexOf(a) - SKILL_LEVELS.indexOf(b));
  const floor = sorted[0];
  const ceiling = sorted[sorted.length - 1];

  const floorScore = levelScore(resort, floor);
  const ceilingScore = levelScore(resort, ceiling);
  // The bottleneck function — the minimum, never the average.
  const bottleneck = Math.min(floorScore, ceilingScore);
  const abilityFit = (bottleneck / 10) * 25;

  let appetiteScore; // 0-10
  const tp = resort.terrain_pct;
  switch (answers.terrain) {
    case "groomers":
      appetiteScore = tp ? clamp((tp.intermediate / 45) * 10, 0, 10) : editorialLevelScore(resort, "intermediate");
      break;
    case "steep":
      appetiteScore = levelScore(resort, "expert");
      break;
    case "mix": {
      const b = levelScore(resort, "beginner"), i = levelScore(resort, "intermediate"), a = levelScore(resort, "expert");
      appetiteScore = (b + i + a) / 3;
      break;
    }
    default: // noPreference — flexible answer, zero weight on this axis
      appetiteScore = 10;
  }

  return {
    total: clamp(abilityFit + appetiteScore, 0, 35),
    floor, ceiling, floorScore, ceilingScore, bottleneck,
  };
}

// --- Budget fit (15 pts) -----------------------------------------------------
function budgetScore(resort, answers) {
  if (!answers.budget) return 15;
  const userIdx = COST_TIERS.indexOf(answers.budget);
  const resortIdx = COST_TIERS.indexOf(resort.cost_tier);
  if (userIdx < 0 || resortIdx < 0) return 10;
  const diff = resortIdx - userIdx;
  if (diff <= 0) return 15;
  return clamp(15 - diff * 6, 0, 15);
}

// --- Vibe / town fit (15 pts) ------------------------------------------------
function vibeScore(resort, answers) {
  if (!answers.vibe || answers.vibe === "noPreference") return 15;
  const vibe = (resort.town_vibe || "").toLowerCase();
  const tags = resort.best_for_tags || [];
  if (answers.vibe === "lively") {
    if (tags.includes("apres-scene") || /lively|nightlife|bar|busy|party|younger/.test(vibe)) return 15;
    if (/quiet|low-key/.test(vibe)) return 3;
    return 8;
  }
  if (answers.vibe === "chill") {
    if (tags.includes("quiet") || /quiet|low-key|laid-back|uncrowded/.test(vibe)) return 15;
    if (tags.includes("apres-scene") || /busy|brutal|nightlife/.test(vibe)) return 4;
    return 9;
  }
  if (answers.vibe === "family") {
    if (tags.includes("family") || /family/.test(vibe)) return 15;
    return 6;
  }
  return 10;
}

// --- Non-ski / family infrastructure (15 pts, only meaningfully weighted for
// groups with a beginner/kid signal) ------------------------------------------
function familyInfraScore(resort, answers) {
  const floorLevel = answers.skillLevels && answers.skillLevels.length
    ? [...answers.skillLevels].sort((a, b) => SKILL_LEVELS.indexOf(a) - SKILL_LEVELS.indexOf(b))[0]
    : null;
  const needsWeight = floorLevel === "never-skied" || floorLevel === "beginner" || answers.vibe === "family";
  if (!needsWeight) return 7.5; // near-zero differentiating weight for a solo expert
  const fs = FIELD_STRENGTH[resort.family_ski_school] ?? 5;
  const nonSki = { strong: 10, decent: 6, thin: 2 }[resort.non_ski_activities] ?? 5;
  return clamp((fs * 0.6 + nonSki * 0.4) * 1.5, 0, 15);
}

// --- Travel feasibility (20 pts, soft-gate for driving per §3.4) -------------
function regionById(id) {
  return REGIONS.find((r) => r.id === id) || null;
}

function travelScore(resort, answers) {
  if (!answers.travelMode || answers.travelMode === "unsure") {
    return { score: 20, excluded: false, distanceMiles: null, mode: "unsure" };
  }
  const region = answers.region ? regionById(answers.region) : null;
  const distanceMiles = region && region.lat != null
    ? haversineMiles(region.lat, region.lon, resort.lat, resort.lon)
    : null;

  if (answers.travelMode === "driving") {
    if (distanceMiles == null) return { score: 12, excluded: false, distanceMiles: null, mode: "driving" };
    const HARD_GATE = 700;
    if (distanceMiles > HARD_GATE) {
      return { score: 0, excluded: true, distanceMiles, mode: "driving" };
    }
    const score = 20 * clamp(1 - distanceMiles / HARD_GATE, 0.1, 1);
    return { score, excluded: false, distanceMiles, mode: "driving" };
  }

  // flying
  const tags = resort.best_for_tags || [];
  let score = 14;
  if (tags.includes("easy-flight")) score += 6;
  else if (distanceMiles != null && distanceMiles < 1200) score += 3;
  let excluded = false;
  if (resort.scale === "day-trip") { score *= 0.2; excluded = true; } // never worth flying to a day-trip hill
  return { score: clamp(score, 0, 20), excluded, distanceMiles, mode: "flying" };
}

// --- Reason bullets (strategy.md §3.5 — never a bare score) -----------------
function pluralize(n, unit) { return `${n} ${unit}${n === 1 ? "" : "s"}`; }

function buildReasonBullets(resort, answers, breakdown) {
  const bullets = [];

  // Bullet 1: group / terrain fit
  if (answers.groupType === "mixed" || answers.groupType === "wide-mixed") {
    const floorWord = SKILL_LABEL[breakdown.terrain.floor];
    const ceilingWord = SKILL_LABEL[breakdown.terrain.ceiling];
    if (breakdown.terrain.bottleneck >= 6) {
      bullets.push(`You said your crew ranges from ${floorWord} to ${ceilingWord} — ${resort.name} has real beginner terrain and genuine advanced terrain, so nobody's stuck on the easy runs or bored on the harder ones.`);
    } else {
      bullets.push(`You said your crew ranges from ${floorWord} to ${ceilingWord} — ${resort.name} is the strongest realistic fit for that spread among what's actually available.`);
    }
  } else if (answers.skillLevels && answers.skillLevels.length) {
    const lvl = SKILL_LABEL[answers.skillLevels[0]];
    if (answers.terrain === "steep") {
      bullets.push(`You said steep and challenging — ${resort.name} delivers real advanced terrain to match your ${lvl} level.`);
    } else if (answers.terrain === "groomers") {
      bullets.push(`You said smooth, groomed trails — ${resort.name} has the cruising terrain to back it up.`);
    } else {
      bullets.push(`You said ${lvl} — ${resort.name} is a genuine fit for that level.`);
    }
  }

  // Bullet 2: travel
  if (breakdown.travel.mode === "unsure") {
    bullets.push("We didn't factor in how far this is, since you weren't sure yet.");
  } else if (breakdown.travel.mode === "driving" && breakdown.travel.distanceMiles != null) {
    const hours = Math.round((breakdown.travel.distanceMiles / 55) * 10) / 10;
    const region = regionById(answers.region);
    bullets.push(`You're driving from ${region ? region.label : "your area"} — this is around ${pluralize(Math.max(1, Math.round(hours)), "hour")}, no flight needed.`);
  } else if (breakdown.travel.mode === "flying") {
    bullets.push(`You're flying in — ${resort.nearest_airport} gets you close, about ${resort.airport_drive_time_min != null ? pluralize(resort.airport_drive_time_min, "minute") : "a short drive"} from the airport to the mountain.`);
  }

  // Bullet 3: budget
  const budgetLabel = { "$": "budget-conscious", "$$": "mid-range", "$$$": "splurge-friendly", "$$$$": "money's no object" }[answers.budget];
  if (answers.budget) {
    if (COST_TIERS.indexOf(resort.cost_tier) <= COST_TIERS.indexOf(answers.budget)) {
      bullets.push(`You said ${budgetLabel} — this comes in at ${resort.cost_tier}, right in that range.`);
    } else {
      bullets.push(`You said ${budgetLabel} — this runs a bit higher (${resort.cost_tier}), but it's the strongest overall fit for everything else you said.`);
    }
  }

  return bullets.slice(0, 3);
}

// --- Session-seeded weighted random (§3.3 tie-break step 3) -----------------
// Identical answers within the same session return the same result; different
// sessions with similar inputs can surface different, comparably-good picks.
let SESSION_SEED = Math.floor(Math.random() * 2 ** 31);
function answersHash(answers) {
  return hashStr(JSON.stringify(answers));
}

// In-memory (JS-variable, not localStorage — see build notes) anti-repetition
// memory of resorts recently surfaced on this device/session.
const recentlyShownResortIds = [];
function noteShown(id) {
  recentlyShownResortIds.unshift(id);
  if (recentlyShownResortIds.length > 5) recentlyShownResortIds.pop();
}

/**
 * Scores every resort in the pool against the trip-planner answers and
 * returns a ranked result, or null if nothing clears the hard gates.
 */
function matchTrip(answers, pool) {
  pool = pool || RESORTS;
  const scored = [];

  for (const resort of pool) {
    const terrain = terrainSkillScore(resort, answers);
    const budget = budgetScore(resort, answers);
    const vibe = vibeScore(resort, answers);
    const family = familyInfraScore(resort, answers);
    const travel = travelScore(resort, answers);

    if (travel.excluded) continue; // hard gate — genuinely wrong answer, not just lower-scored

    const total = terrain.total + budget + vibe + family + travel.score;
    scored.push({ resort, total, breakdown: { terrain, budget, vibe, family, travel } });
  }

  if (!scored.length) return null;

  scored.sort((a, b) => b.total - a.total);

  const TIE_BAND = 4;
  const topScore = scored[0].total;
  const tied = scored.filter((s) => topScore - s.total <= TIE_BAND);

  // Tie-break 1: anti-repetition nudge (device/session-local).
  // NOTE: strategy.md §3.3's original tie-break 1 ("presence of a Nicole hot
  // take") has been removed per Director ruling (2026-08-03): "just stop
  // boosting them." Her takes are pure commentary with no effect on the pick,
  // either way — presence-only was never a sentiment check (hot_take.rating
  // is null for every resort that has a take), so it silently promoted
  // resorts regardless of whether her take was positive or a warning. No
  // sentiment-based substitute was requested — Nicole explicitly deferred
  // sentiment scoring to a post-launch feature. This step is now the first
  // tie-break, exactly as strategy.md's own ordering falls back to once step
  // 1 is removed, so anti-repetition still does real diversifying work.
  const notRecent = tied.filter((s) => !recentlyShownResortIds.includes(s.resort.id));
  const pickPool = notRecent.length ? notRecent : tied;

  // Tie-break 2: session-seeded weighted-random among the remaining tied set
  const seed = (SESSION_SEED ^ answersHash(answers)) >>> 0;
  const rng = mulberry32(seed);
  const idx = Math.floor(rng() * pickPool.length);
  const winner = pickPool[idx];

  const reasonBullets = buildReasonBullets(winner.resort, answers, winner.breakdown);
  noteShown(winner.resort.id);

  return {
    resort: winner.resort,
    score: winner.total,
    breakdown: winner.breakdown,
    reasonBullets,
    showRangeReadout: answers.groupType === "mixed" || answers.groupType === "wide-mixed",
  };
}

// ---------------------------------------------------------------------------
// Chase the Snow — strategy.md §4
// ---------------------------------------------------------------------------

function normalizeField(values) {
  const nums = values.filter((v) => v != null);
  if (!nums.length) return () => 0.5;
  const min = Math.min(...nums), max = Math.max(...nums);
  if (max === min) return () => 0.5;
  return (v) => (v == null ? 0.5 : clamp01((v - min) / (max - min)));
}

function terrainWorthItRaw(resort) {
  const tags = resort.best_for_tags || [];
  const tagHits = ["deep-powder", "steeps", "tree-skiing"].filter((t) => tags.includes(t)).length;
  const pctScore = resort.terrain_pct ? resort.terrain_pct.advanced_expert / 100 : editorialLevelScore(resort, "expert") / 10;
  return clamp01(pctScore * 0.6 + (tagHits / 3) * 0.4);
}

const CROWD_PENALTY = { low: 0, moderate: 0.3, high: 0.6, brutal: 1 };

/**
 * Ranks US resorts by the Chase-the-Snow formula (§4.2). `forecasts` maps
 * resort id -> { totalInches, avgTempF, isLive } (already resolved, live or
 * historical fallback — this function is agnostic to the data source, which
 * is exactly what keeps the honesty rule enforceable in one place: the UI
 * layer decides how to label the source, this layer only ranks).
 */
function rankChaseTheSnow(forecasts, answers, pool) {
  pool = pool || RESORTS;
  answers = answers || {};
  const usResorts = pool.filter((r) => r.country === "USA" && forecasts[r.id]);

  const snowValues = usResorts.map((r) => forecasts[r.id].totalInches);
  const normSnow = normalizeField(snowValues);

  const scored = usResorts.map((resort) => {
    const fc = forecasts[resort.id];
    const snowQuality = fc.avgTempF != null ? clamp01(1 - (fc.avgTempF - 10) / 45) : 0.6;
    const terrainWorth = terrainWorthItRaw(resort);
    const crowdPenalty = CROWD_PENALTY[resort.crowd_level] ?? 0.3;

    let score =
      0.45 * normSnow(fc.totalInches) +
      0.20 * snowQuality +
      0.20 * terrainWorth -
      0.10 * crowdPenalty;

    if (!answers.includeBeginnerFriendly) {
      if (resort.scale === "day-trip") return null; // leans toward serious terrain by default
      if (terrainWorth < 0.22) score *= 0.5;
    } else if (resort.beginner_friendliness === "strong") {
      score += 0.05;
    }

    let feasibility = null;
    if (answers.region) {
      const region = regionById(answers.region);
      if (region && region.lat != null) {
        const distanceMiles = haversineMiles(region.lat, region.lon, resort.lat, resort.lon);
        feasibility = { distanceMiles };
        const tags = resort.best_for_tags || [];
        const reachable = distanceMiles != null && (distanceMiles < 700 || tags.includes("easy-flight"));
        score *= reachable ? 1 : 0.35;
      }
    }

    return {
      resort, score, snowQuality, terrainWorth, crowdPenalty,
      totalInches: fc.totalInches, avgTempF: fc.avgTempF, isLive: fc.isLive,
      feasibility,
    };
  }).filter(Boolean);

  scored.sort((a, b) => b.score - a.score);
  return scored.slice(0, 8);
}

function rankCanadaTypicalSeason(pool) {
  pool = pool || RESORTS;
  return pool
    .filter((r) => r.country === "Canada")
    .slice()
    .sort((a, b) => (b.avg_annual_snowfall_in || 0) - (a.avg_annual_snowfall_in || 0));
}

</script>
<script>
// ---------------------------------------------------------------------------
// NOAA / National Weather Service integration — api.weather.gov.
// Built fallback-first per the build brief: the historical-average path is
// complete and correct on its own, and the app is fully usable with the
// network unavailable. The live path is layered on top and can fail at any
// point without ever presenting historical data as if it were live.
//
// Flow (per scope-revision-1 / strategy.md §4): /points/{lat},{lon} resolves
// a coordinate to a forecast office + grid cell, then
// /gridpoints/{office}/{x},{y}/forecastGridData returns time-stamped periods
// including snowfallAmount (millimetres) and temperature. 7-day horizon.
//
// Fix round, 2026-08-04 — root-caused why the live path never worked in
// production (Director-reported, confirmed by NWS maintainers:
// https://github.com/weather-gov/api/discussions/312): setting a custom
// `User-Agent` in a browser `fetch()` triggers a CORS preflight, and
// api.weather.gov's preflight response doesn't allow-list `User-Agent`, so
// every request failed before it ever reached the API. NWS's own guidance is
// that the descriptive-User-Agent recommendation is for server-side callers
// only — browser code should omit it and let the browser set its own
// default, which is exactly what this module now does. `Accept:
// application/geo+json` is dropped too: it's CORS-safelisted so it wasn't
// the cause, but the API returns GeoJSON by default and a bare, header-free
// fetch removes all preflight risk rather than just the confirmed one. This
// is now believed-correct against NWS's documented behavior, not just
// theoretically fixed — see build-notes.md for what this environment could
// and couldn't verify directly (sandbox egress to api.weather.gov is still
// blocked here, so the live response shape itself remains unconfirmed).
// ---------------------------------------------------------------------------

const NOAA_BASE = "https://api.weather.gov";
const NOAA_TIMEOUT_MS = 9000; // leaves headroom under the 10s hard fallback in the UI layer

function mmToInches(mm) { return mm / 25.4; }

async function fetchWithTimeout(url, opts, timeoutMs) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  try {
    const res = await fetch(url, { ...opts, signal: controller.signal });
    return res;
  } finally {
    clearTimeout(timer);
  }
}

// ---------------------------------------------------------------------------
// Season-window awareness (fix round, 2026-08-04). historicalEstimate() used
// to compute `annual / 18` regardless of the calendar, which meant an August
// lookup reported a mid-winter weekly average (e.g. "35.6 inches" for Mt.
// Baker) as if it were typical for right now — actively wrong, and exactly
// the kind of thing Principle 3 (never misrepresent data) exists to catch.
// This section makes the estimate season-aware using each resort's own
// `season_open`/`season_close` fields (see research/resorts-schema.md), so
// the weekly figure ramps toward zero outside the resort's own published
// season instead of reporting a flat annual/18 all year round.
// ---------------------------------------------------------------------------

const SEASON_MONTH_INDEX = { jan: 0, feb: 1, mar: 2, apr: 3, may: 4, jun: 5, jul: 6, aug: 7, sep: 8, oct: 9, nov: 10, dec: 11 };
const SEASON_PART_DAY = { early: 5, mid: 15, late: 25 };
const MONTH_LENGTHS = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];

function dayOfYear(month, day) {
  let d = day - 1;
  for (let m = 0; m < month; m++) d += MONTH_LENGTHS[m];
  return d;
}
// Ski seasons run roughly Oct/Nov -> Apr/Jun, which straddles the Jan 1 year
// boundary. Anchoring "day zero" at July 1 (deep off-season for every
// Northern-hemisphere resort in this dataset) keeps every real resort's
// open->close window as one ordinary, non-wrapping range of numbers, which
// is what keeps the comparisons below plain arithmetic instead of modular
// edge-case handling.
const SEASON_ANCHOR_DOY = dayOfYear(6, 1); // July 1
function shiftedSeasonDay(month, day) {
  return (dayOfYear(month, day) - SEASON_ANCHOR_DOY + 365) % 365;
}

/**
 * Parses a resort's `season_open`/`season_close` free-text field (e.g.
 * "Mid-Nov", "Late Apr/early May", "Early Dec (snow-dependent; no
 * snowmaking)", "Year-round on the Palmer snowfield (seasonal closures
 * vary)") by matching the first "{Early|Mid|Late} {Month}" it contains.
 * Returns null when the text doesn't contain one — deliberately: rather than
 * guess at a date from prose the schema doesn't structure that way, callers
 * fall back to *not* applying the seasonal discount for that one resort
 * instead of inventing a boundary. (Only 6 of 71 resorts have this kind of
 * free-text suffix/prefix; all 6 still parse cleanly because the
 * "{part} {month}" pattern is always the leading, well-formed part of the
 * string — see build-notes.md for the audited list.)
 */
function parseSeasonBoundary(text) {
  if (!text) return null;
  const m = /(early|mid|late)[\s-]+([a-z]{3,})/i.exec(text);
  if (!m) return null;
  const monthKey = m[2].slice(0, 3).toLowerCase();
  if (!(monthKey in SEASON_MONTH_INDEX)) return null;
  return { month: SEASON_MONTH_INDEX[monthKey], day: SEASON_PART_DAY[m[1].toLowerCase()] };
}

// ~3 weeks either side of the published open/close date — keeps the
// shoulder months (October, May) a gradient between "typical mid-winter
// figure" and "zero" rather than a hard flip on a single calendar day, per
// the fix brief's explicit boundary requirement.
const SEASON_RAMP_DAYS = 21;

/**
 * Returns 0..1: how "in typical season" `now` is for this resort. 1 = inside
 * the resort's own published open/close window. 0 = well outside it (the
 * case this fix exists for — e.g. August, months after the prior season
 * closed and months before the next one opens). Ramps linearly through
 * SEASON_RAMP_DAYS on either side of open/close. Falls back to 1 (no
 * discount, i.e. the old always-on behavior) when either boundary can't be
 * confidently parsed, or when the parsed window is nonsensical (close <=
 * open) — never guesses at a date it doesn't have.
 */
function seasonFraction(resort, now) {
  now = now || new Date();
  const open = parseSeasonBoundary(resort.season_open);
  const close = parseSeasonBoundary(resort.season_close);
  if (!open || !close) return 1;
  const openDay = shiftedSeasonDay(open.month, open.day);
  const closeDay = shiftedSeasonDay(close.month, close.day);
  if (closeDay <= openDay) return 1;
  const nowDay = shiftedSeasonDay(now.getMonth(), now.getDate());
  if (nowDay >= openDay && nowDay <= closeDay) return 1;
  if (nowDay < openDay) {
    const distance = openDay - nowDay;
    return distance <= SEASON_RAMP_DAYS ? 1 - distance / SEASON_RAMP_DAYS : 0;
  }
  const distance = nowDay - closeDay;
  return distance <= SEASON_RAMP_DAYS ? 1 - distance / SEASON_RAMP_DAYS : 0;
}

/**
 * Historical / typical-season estimate for a resort — always available,
 * works fully offline, and is what the UI falls back to whenever the live
 * path fails for any reason. Never claims to be a forecast: callers must
 * label it via the `isLive: false` flag, per the brief's integrity rule.
 *
 * Distributes the resort's published average annual snowfall across a
 * "typical" 7-day window during the core season, scaled by `seasonFraction`
 * so the figure is honest about *when* "typical" is — outside the resort's
 * own season this returns at or near zero instead of a mid-winter average,
 * and estimates a plausible average temperature from elevation/region —
 * clearly an estimate, never presented to the user as more precise than
 * "typical for this time of year."
 */
function historicalEstimate(resort, now) {
  const annual = resort.avg_annual_snowfall_in;
  const factor = seasonFraction(resort, now);
  // A typical in-season week runs ~18-20 storm-active weeks; distribute
  // unevenly so it isn't a flat, suspiciously round weekly figure. `factor`
  // is what keeps this honest outside the season window (see above).
  const weeklyShare = (annual != null ? annual / 18 : 8) * factor;
  const baseElev = resort.base_elevation_ft || 6000;
  // Rough elevation-based temperature estimate (higher = colder), clamped to
  // a plausible mid-winter range — an estimate, not a measurement. Not
  // season-scaled: nothing in the UI displays this raw value to a reader
  // (see build-notes.md), it only feeds the internal cold/wet snow-quality
  // descriptor for resorts that already cleared the season-window check.
  const avgTempF = clamp(32 - (baseElev / 1000) * 1.1, 5, 30);
  return {
    totalInches: Math.round(weeklyShare * 10) / 10,
    avgTempF: Math.round(avgTempF),
    isLive: false,
    seasonFraction: factor,
  };
}

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

// Per-resort fraction at/above which a resort counts as "meaningfully open"
// for season-state purposes — either fully in-season (1) or more than
// halfway through its pre-season ramp (i.e. within ~10 days of its
// published open date, likely already open in practice).
const SEASON_OPEN_FRACTION = 0.5;
// Aggregate thresholds (share of the US pool that's "meaningfully open")
// used to classify the whole Chase-the-Snow screen's state. Tuned against
// the real 71-resort dataset's actual open/close spread — see
// build-notes.md for the day-by-day sweep that produced these numbers.
const SEASON_STATE_OFF_MAX = 0.10;
const SEASON_STATE_IN_MIN = 0.70;

/**
 * Classifies "right now" against the full US resort pool's typical season
 * windows, independent of whether the live NOAA fetch is reachable — this is
 * a calendar judgment, not a network one, so it runs before any forecast
 * fetch is attempted:
 *   - "off-season": ~everything is closed for the calendar year (e.g.
 *     August) — Chase-the-Snow shouldn't render a ranked list at all.
 *   - "shoulder": some resorts are open, most aren't (October, May) —
 *     render a filtered, honestly-labeled list of just the plausibly-open
 *     resorts.
 *   - "in-season": the normal case — render the full ranked list as before.
 */
function classifySeasonState(pool, now) {
  now = now || new Date();
  const resorts = (pool || []).filter((r) => r.country === "USA" && r.lat != null);
  if (!resorts.length) return { state: "in-season", openShare: 1, avgFraction: 1 };
  let sum = 0, openCount = 0;
  for (const r of resorts) {
    const f = seasonFraction(r, now);
    sum += f;
    if (f >= SEASON_OPEN_FRACTION) openCount += 1;
  }
  const avgFraction = sum / resorts.length;
  const openShare = openCount / resorts.length;
  let state = "shoulder";
  if (openShare <= SEASON_STATE_OFF_MAX) state = "off-season";
  else if (openShare >= SEASON_STATE_IN_MIN) state = "in-season";
  return { state, openShare, avgFraction };
}

/**
 * Attempts the live NOAA chain for one resort. Throws on any failure —
 * callers must catch and fall back. Never silently returns partial/guessed
 * data dressed up as live.
 */
async function fetchLiveForecast(resort) {
  if (resort.lat == null || resort.lon == null) {
    throw new Error("no coordinates — forecast unavailable for this resort");
  }
  // No custom headers on the browser fetch path, deliberately — see the
  // module header comment. A bare fetch (browser sets its own User-Agent,
  // no Accept override) avoids the CORS preflight that was silently failing
  // every live request in production.

  const pointsRes = await fetchWithTimeout(
    `${NOAA_BASE}/points/${resort.lat.toFixed(4)},${resort.lon.toFixed(4)}`,
    {}, NOAA_TIMEOUT_MS
  );
  if (!pointsRes.ok) throw new Error(`NOAA /points failed: ${pointsRes.status}`);
  const points = await pointsRes.json();
  const { gridId, gridX, gridY } = points.properties || {};
  if (!gridId || gridX == null || gridY == null) throw new Error("NOAA /points missing grid info");

  const gridRes = await fetchWithTimeout(
    `${NOAA_BASE}/gridpoints/${gridId}/${gridX},${gridY}/forecastGridData`,
    {}, NOAA_TIMEOUT_MS
  );
  if (!gridRes.ok) throw new Error(`NOAA /gridpoints failed: ${gridRes.status}`);
  const grid = await gridRes.json();

  const props = grid.properties || {};
  const snowfallValues = (props.snowfallAmount && props.snowfallAmount.values) || [];
  const tempValues = (props.temperature && props.temperature.values) || [];

  const now = Date.now();
  const horizon = now + 7 * 24 * 60 * 60 * 1000;

  let totalMm = 0;
  let sawSnowPeriod = false;
  for (const period of snowfallValues) {
    const start = Date.parse((period.validTime || "").split("/")[0]);
    if (Number.isNaN(start) || start < now || start > horizon) continue;
    totalMm += period.value || 0;
    if ((period.value || 0) > 0) sawSnowPeriod = true;
  }

  let tempSum = 0, tempCount = 0;
  for (const period of tempValues) {
    const start = Date.parse((period.validTime || "").split("/")[0]);
    if (Number.isNaN(start) || start < now || start > horizon) continue;
    if (period.value == null) continue;
    tempSum += celsiusToF(period.value);
    tempCount += 1;
  }

  return {
    totalInches: Math.round(mmToInches(totalMm) * 10) / 10,
    avgTempF: tempCount ? Math.round(tempSum / tempCount) : null,
    isLive: true,
    sawSnowPeriod,
  };
}

function celsiusToF(c) { return (c * 9) / 5 + 32; }

/**
 * Best-effort classification of a fetch failure into something a human can
 * act on, since the browser deliberately hides the real reason a cross-
 * origin request failed (a CORS rejection and a plain network outage both
 * surface to JS as the same opaque `TypeError: Failed to fetch` — that
 * ambiguity is exactly what left the Director unable to tell "CORS is
 * blocking us" from "no snow" in production). This can't recover the
 * specific reason the browser withheld, but it does distinguish the cases
 * we *can* tell apart (timeout vs. an HTTP error status vs. everything
 * else) and names the CORS possibility explicitly so it's the first thing
 * a developer checks, not a guess they have to arrive at independently.
 */
function classifyFetchError(err) {
  if (err && err.name === "AbortError") return "timeout";
  if (err && /^NOAA \/(points|gridpoints) failed: \d+/.test(err.message || "")) return "http-error";
  if (err instanceof TypeError) return "network-or-cors";
  return "unknown";
}

/**
 * Resolves a forecast for one resort: tries the live path, falls back to the
 * historical estimate on any failure. Always resolves (never rejects) so
 * callers can build a full ranked list even when every live call fails.
 *
 * Every failure is logged via console.warn with the resort id, the best
 * guess at *why* (timeout / HTTP error / likely network-or-CORS), and the
 * raw error message — retrievable from devtools even though the UI itself
 * only ever shows the honest, generic "couldn't reach the live forecast"
 * copy (per fallback.forecast.body, which deliberately doesn't name a
 * specific technical cause to the end user).
 */
async function resolveForecast(resort) {
  try {
    const live = await fetchLiveForecast(resort);
    return live;
  } catch (err) {
    const reason = classifyFetchError(err);
    console.warn(`[NOAA live forecast failed] resort=${resort.id} reason=${reason} message=${(err && err.message) || err}`);
    return { ...historicalEstimate(resort), fallbackReason: err.message };
  }
}

/**
 * Resolves forecasts for a set of US resorts with the UI-facing timing model
 * from motion-spec.md §4.1: no loader before 300ms, "still checking" copy at
 * 4s, hard fallback (historical data for anything still pending) at 10s.
 *
 * onState receives 'loading' | 'escalated' | 'fallback' | 'done' and, on
 * done, the resolved { [resortId]: forecast } map plus whether *any* resort
 * fell back (used to decide whether the fallback badge renders at all).
 */
/**
 * Returns a handle `{ skip() }` in addition to driving `onState`. `skip()`
 * lets the UI layer offer a manual "show typical-season data now" escape
 * once the escalated (4s) state is reached, rather than forcing every user
 * to ride out the full 10s hard timeout — the worst-case wait lands
 * precisely on the poor-connectivity conditions Jordan and Nicole are
 * defined by, for the one mode built around "an answer in three seconds"
 * (heuristic-evaluation.md, H1/H3/H7 major finding). The historical data
 * `skip()` falls back to is always already sitting there — it's the same
 * data the 10s hard timeout would have produced anyway, just returned on
 * request instead of on a clock.
 */
function loadChaseForecasts(resorts, onState) {
  const results = {};
  let settled = 0;
  let anyFallback = false;
  const total = resorts.length;
  let done = false;

  const loadingTimer = setTimeout(() => { if (!done) onState("loading"); }, 300);
  const escalateTimer = setTimeout(() => { if (!done) onState("escalated"); }, 4000);

  function fallBackNow() {
    if (done) return;
    // Anything still unresolved gets the historical estimate immediately
    // rather than waiting further — used by both the 10s hard timeout and
    // the user-triggered skip() escape.
    for (const r of resorts) {
      if (!(r.id in results)) {
        results[r.id] = historicalEstimate(r);
        results[r.id].fallbackReason = "timed out";
        anyFallback = true;
      }
    }
    finish();
  }

  const hardTimer = setTimeout(fallBackNow, 10000);

  function finish() {
    if (done) return;
    done = true;
    clearTimeout(loadingTimer);
    clearTimeout(escalateTimer);
    clearTimeout(hardTimer);
    onState("done", { forecasts: results, anyFallback });
  }

  if (!total) { finish(); return { skip: () => {} }; }

  for (const resort of resorts) {
    resolveForecast(resort).then((forecast) => {
      results[resort.id] = forecast;
      if (!forecast.isLive) anyFallback = true;
      settled += 1;
      if (settled === total) finish();
    });
  }

  return { skip: fallBackNow };
}

// ---------------------------------------------------------------------------
// Per-day forecast — added for Quiver Check.
//
// Everything above this line answers "how much snow over the next 7 days, in
// total" — which is the right shape for ranking a list of resorts, and the
// wrong shape for "what should I ride at Alta on Thursday." That question
// needs the week broken into days, and it needs two fields the ranking path
// never asked for: liquid-equivalent precipitation (so quiver.js can compute
// a real snow-to-liquid ratio rather than inferring density from temperature
// alone) and a per-day high/low.
//
// This is additive on purpose. The Chase-the-Snow path above is verified and
// shipped; nothing here changes it, and the two share the same fetch chain,
// the same timeout discipline and the same never-present-history-as-forecast
// rule.
// ---------------------------------------------------------------------------

const QUIVER_HORIZON_DAYS = 7;

// NWS gridpoint values are UTC-stamped, but "Thursday" means Thursday at the
// mountain. `/points` hands back the grid's IANA timezone in the same
// response we already read gridId/gridX/gridY from, so bucketing by local
// calendar day costs one extra field and no extra request. 'en-CA' is used
// purely because it formats as YYYY-MM-DD.
function localDayKey(date, timeZone) {
  try {
    return new Intl.DateTimeFormat("en-CA", {
      timeZone: timeZone || undefined,
      year: "numeric", month: "2-digit", day: "2-digit",
    }).format(date);
  } catch (e) {
    // An unrecognised timezone must not take the whole forecast down with
    // it — fall back to the viewer's own local day.
    return new Intl.DateTimeFormat("en-CA", { year: "numeric", month: "2-digit", day: "2-digit" }).format(date);
  }
}

// ISO-8601 durations, as they actually appear in gridpoint validTime strings
// ("PT1H", "PT6H", "P1D", "P1DT6H"). Returns hours.
function parseIsoDurationHours(dur) {
  const m = /^P(?:(\d+)D)?(?:T(?:(\d+)H)?(?:(\d+)M)?)?$/.exec(dur || "");
  if (!m) return 1;
  const days = Number(m[1] || 0), hours = Number(m[2] || 0), mins = Number(m[3] || 0);
  const total = days * 24 + hours + mins / 60;
  return total > 0 ? total : 1;
}

/**
 * Walks a gridpoint value series and hands each hour of every interval to
 * `visit(date, value, hours)`.
 *
 * Intervals in a gridpoint response are commonly 1h or 6h but run longer at
 * the far end of the horizon, and they do not align to local midnight — a
 * 6-hour block straddling midnight belongs partly to each day. Stepping
 * hour-by-hour and letting the caller apportion is what keeps a storm from
 * being credited entirely to whichever day its interval happened to start
 * in, which for a chosen-day feature is the difference between "18 inches on
 * your day" and "18 inches the day before you arrive."
 */
function eachForecastHour(values, visit) {
  for (const period of values || []) {
    const [startStr, durStr] = String(period.validTime || "").split("/");
    const start = Date.parse(startStr);
    if (Number.isNaN(start) || period.value == null) continue;
    const hours = parseIsoDurationHours(durStr);
    const steps = Math.max(1, Math.round(hours));
    for (let h = 0; h < steps; h++) {
      visit(new Date(start + h * 3600000), period.value, steps);
    }
  }
}

function emptyDay(dateKey, isLive) {
  return { dateKey, snowIn: 0, precipIn: 0, highF: null, lowF: null, isLive, hasData: false };
}

/**
 * Live per-day forecast for one resort. Same two-request chain as
 * fetchLiveForecast() above, same bare header-free fetch (see this module's
 * header for why any custom header breaks the browser path), and it throws
 * on any failure so callers must fall back rather than receive a guess.
 */
async function fetchLiveDailyForecast(resort) {
  if (resort.lat == null || resort.lon == null) {
    throw new Error("no coordinates — forecast unavailable for this resort");
  }
  const pointsRes = await fetchWithTimeout(
    `${NOAA_BASE}/points/${resort.lat.toFixed(4)},${resort.lon.toFixed(4)}`,
    {}, NOAA_TIMEOUT_MS
  );
  if (!pointsRes.ok) throw new Error(`NOAA /points failed: ${pointsRes.status}`);
  const points = await pointsRes.json();
  const { gridId, gridX, gridY, timeZone } = points.properties || {};
  if (!gridId || gridX == null || gridY == null) throw new Error("NOAA /points missing grid info");

  const gridRes = await fetchWithTimeout(
    `${NOAA_BASE}/gridpoints/${gridId}/${gridX},${gridY}/forecastGridData`,
    {}, NOAA_TIMEOUT_MS
  );
  if (!gridRes.ok) throw new Error(`NOAA /gridpoints failed: ${gridRes.status}`);
  const grid = await gridRes.json();
  const props = grid.properties || {};

  const days = buildDayFrame(new Date(), timeZone, true);
  const byKey = Object.fromEntries(days.map((d) => [d.dateKey, d]));

  eachForecastHour((props.snowfallAmount || {}).values, (at, value, steps) => {
    const d = byKey[localDayKey(at, timeZone)];
    if (d) { d.snowIn += mmToInches(value) / steps; d.hasData = true; }
  });
  eachForecastHour((props.quantitativePrecipitation || {}).values, (at, value, steps) => {
    const d = byKey[localDayKey(at, timeZone)];
    if (d) { d.precipIn += mmToInches(value) / steps; }
  });
  eachForecastHour((props.temperature || {}).values, (at, value) => {
    const d = byKey[localDayKey(at, timeZone)];
    if (!d) return;
    const f = celsiusToF(value);
    d.highF = d.highF == null ? f : Math.max(d.highF, f);
    d.lowF = d.lowF == null ? f : Math.min(d.lowF, f);
    d.hasData = true;
  });

  for (const d of days) {
    d.snowIn = Math.round(d.snowIn * 10) / 10;
    d.precipIn = Math.round(d.precipIn * 100) / 100;
    if (d.highF != null) d.highF = Math.round(d.highF);
    if (d.lowF != null) d.lowF = Math.round(d.lowF);
  }

  // A response that resolved but carried no usable values for any day is a
  // failure, not an empty forecast — throwing sends it down the honest
  // fallback path instead of rendering a week of confident zeroes.
  if (!days.some((d) => d.hasData)) throw new Error("NOAA gridpoints returned no usable values");

  return { days, timeZone: timeZone || null, isLive: true };
}

// The frame of days the UI offers, independent of whether any data lands in
// them — so the day picker is the same shape on the live and fallback paths.
function buildDayFrame(now, timeZone, isLive) {
  const out = [];
  for (let i = 0; i < QUIVER_HORIZON_DAYS; i++) {
    const at = new Date(now.getTime() + i * 86400000);
    out.push(emptyDay(localDayKey(at, timeZone), isLive));
  }
  return out;
}

/**
 * Typical-season per-day fallback. Deliberately FLAT: every day in the frame
 * gets the same figure.
 *
 * The aggregate path above can honestly say "a typical week here is about 20
 * inches" because a week is the unit the annual average divides into. Split
 * that across named days and any variation would be invented — there is no
 * basis whatsoever for claiming Thursday is the snowy one in a normal
 * February. A flat distribution is the only shape that doesn't fabricate a
 * storm, and `isLive: false` carries the label the UI is required to render.
 */
function historicalDailyForecast(resort, now) {
  now = now || new Date();
  const est = historicalEstimate(resort, now);
  const perDay = Math.round((est.totalInches / 7) * 10) / 10;
  const days = buildDayFrame(now, null, false);
  for (const d of days) {
    d.snowIn = perDay;
    // 10:1 is the textbook average and the only defensible ratio to assume
    // when there's no measurement to divide — quiver.js's density read will
    // land on "average-density" and its copy never claims a measured ratio
    // on this path.
    d.precipIn = Math.round((perDay / 10) * 100) / 100;
    d.highF = est.avgTempF;
    d.lowF = est.avgTempF != null ? est.avgTempF - 12 : null;
    d.hasData = true;
  }
  return { days, timeZone: null, isLive: false, seasonFraction: est.seasonFraction };
}

/**
 * Always resolves. Tries live, falls back to typical-season on any failure,
 * and — as with resolveForecast() above — logs the classified reason so a
 * developer can tell a CORS rejection from a genuine outage, while the UI
 * shows only the honest generic copy.
 *
 * Canada resolves straight to the fallback without a request: NOAA has no
 * non-US coverage, so attempting one would spend a 9-second timeout to learn
 * something already known.
 */
async function resolveDailyForecast(resort, now) {
  if (resort.country !== "USA" || resort.lat == null) {
    return { ...historicalDailyForecast(resort, now), fallbackReason: "outside NOAA coverage" };
  }
  try {
    return await fetchLiveDailyForecast(resort);
  } catch (err) {
    const reason = classifyFetchError(err);
    console.warn(`[NOAA daily forecast failed] resort=${resort.id} reason=${reason} message=${(err && err.message) || err}`);
    return { ...historicalDailyForecast(resort, now), fallbackReason: (err && err.message) || String(err) };
  }
}

</script>
<script>
// ---------------------------------------------------------------------------
// Quiver Check — which skis to bring, for one resort on one day.
//
// The third primary mode's question is different from the other two. Plan a
// Trip asks "where should I go?"; Chase the Snow asks "where is it dumping?";
// Quiver Check asks "I already know where and when — what do I put on my
// feet?" So it takes a resort and a date as *given* and spends all of its
// reasoning on the one output: a ski type.
//
// This module is pure — no DOM, no fetch, no clock of its own. Everything it
// needs arrives as arguments, which is what makes verify_quiver.js able to
// sweep the whole decision surface (every resort × a grid of synthetic
// conditions) without a browser or a network. app-quiver.js owns all the
// rendering; noaa.js owns all the data acquisition.
//
// --- The honesty boundary, stated up front --------------------------------
// This reads a *forecast*. It cannot see the snow report. It does not know
// the settled base depth, whether the groomers ran last night, whether the
// wind stripped the ridge, or what got tracked out yesterday. NOAA publishes
// none of that. Per R8, the UI says so plainly rather than implying a
// precision the inputs don't support, and every threshold below is expressed
// as a band with a stated "if you don't own that" fallback — because the
// honest answer to "should I ride my 108s or my 118s?" is usually "either,
// here's the difference."
// ---------------------------------------------------------------------------

// --- The taxonomy ----------------------------------------------------------
// Eight calls. Waist widths are the real industry bands, not invented ones:
// a "powder ski" has meant 110mm+ underfoot for about fifteen years and a
// frontside carver has meant sub-85 for longer than that. `rank` orders them
// by width so the copy layer can say "one step wider than" without a lookup
// table of its own. `rock-skis` and `bumps` sit outside the width ladder
// (rank null) because they're chosen for construction, not float.
